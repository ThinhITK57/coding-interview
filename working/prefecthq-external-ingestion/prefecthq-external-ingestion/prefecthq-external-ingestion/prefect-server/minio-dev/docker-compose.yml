services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    container_name: minio

    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    volumes:
      - minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

volumes:
  minio_data:
    name: minio_data
