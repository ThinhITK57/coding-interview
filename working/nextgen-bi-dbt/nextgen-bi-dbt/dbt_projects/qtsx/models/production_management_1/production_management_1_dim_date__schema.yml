version: 2
models:
- name: production_management_1_dim_date
  description: "Bảng production_management_1_dim_date (nguồn Power BI: Dim_Date)."
  meta:
    label: "Dim_Date"
    powerbi_source: "Dim_Date"
    metrics:
      max_date_value:
        type: max
        sql: date_value
        label: "max_date_value"
        description: "Sinh từ Power BI: max(Dim_Date.Date)"
      min_date_value:
        type: min
        sql: date_value
        label: "min_date_value"
        description: "Sinh từ Power BI: min(Dim_Date.Date)"
  columns:
  - name: date_value
    description: "Ngày. Dựng lại từ CALENDAR(2024-12-01, 2030-12-31) — xem sql_overrides."
    meta:
      dimension:
        type: date
        label: "Date"
  - name: year_value
    description: "Cột Year trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "Year"
  - name: month_value
    description: "Cột Month trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "Month"
        hidden: true
  - name: month_name
    description: "Cột MonthName trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "MonthName"
  - name: quarter
    description: "Cột Quarter trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "Quarter"
  - name: week_num
    description: "Cột WeekNum trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "WeekNum"
        hidden: true
  - name: week_year
    description: "Cột WeekYear trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "Date Hierarchy WeekYear"
  - name: month_year
    description: "Cột MonthYear trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "MonthYear"
  - name: quarter_year
    description: "Cột QuarterYear trong Dim_Date."
    meta:
      dimension:
        type: string
        label: "QuarterYear"
  - name: week_start
    description: "Thứ 2 của tuần chứa ngày này."
    meta:
      dimension:
        type: date
        label: "WeekStart"
        hidden: true
  - name: week_end
    description: "Chủ nhật của tuần chứa ngày này."
    meta:
      dimension:
        type: date
        label: "WeekEnd"
        hidden: true
  - name: week
    description: "Cột Tuần trong Dim_Date. Cột tính toán, DAX gốc: IF(WEEKNUM('Dim_Date'[Date],2)>52, \"Tuần 1\" & \" (\" & FORMAT('Dim_Date'[Date] - WEEKDAY('Dim_Date'[Date],2) + 1, \"dd/MM/YYYY\") & \" - \" & FORMAT('Dim_Date'[Date] - WEEKDAY('Dim_Date'[Date],2) + 7, \"dd/MM/YYYY\") & \")\", \"Tuần \" & WEEKNUM('Dim_Date'[Date],2) & \" (\" & FORMAT('Dim_Date'[Date] - WEEKDAY('Dim_Date'[Date],2) + 1, \"dd/MM/YYYY\") & \" - \" & FORMAT('Dim_Date'[Date] - WEEKDAY('Dim_Date'[Date],2) + 7, \"dd/MM/YYYY\") & \")\")"
    meta:
      dimension:
        type: string
        label: "Tuần"
  - name: is_before_last_sunday_prev_week
    description: "1 nếu ngày <= Chủ nhật gần nhất trước TODAY()+7. Phụ thuộc ngày chạy query."
    meta:
      dimension:
        type: number
        label: "IsBeforeLastSundayPrevWeek"
        hidden: true
  - name: day_in_week
    description: "Cột DayInWeek trong Dim_Date. Cột tính toán, DAX gốc: FORMAT('Dim_Date'[Date],\"ddd\")"
    meta:
      dimension:
        type: string
        label: "DayInWeek"
        hidden: true
  - name: sort_key
    description: "yyyymmdd."
    meta:
      dimension:
        type: number
        label: "SortKey"
        hidden: true
  - name: quarter_sort_key
    description: "YEAR*10 + quý, cộng 100 nếu quý 4 (đúng DAX gốc)."
    meta:
      dimension:
        type: number
        label: "QuarterSortKey"
        hidden: true
  - name: week_sort_key
    description: "YEAR nối WEEKNUM, KHÔNG zero-pad (tuần 5/2025 -> 20255). Giữ nguyên hành vi gốc."
    meta:
      dimension:
        type: number
        label: "WeekSortKey"
        hidden: true
