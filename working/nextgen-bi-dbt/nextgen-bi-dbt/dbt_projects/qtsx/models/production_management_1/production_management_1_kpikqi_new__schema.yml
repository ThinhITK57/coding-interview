    description: "Cột So với target_TĐ trong KPIKQI_New. Cột tính toán, DAX gốc: IF('KPIKQI_New'[Metric name] = \"MTTD VCS (giờ)\",-1, VAR _Target = 'KPIKQI_New'[Target_TĐ] VAR _Result = ROUND('KPIKQI_New'[Kết quả],2) VAR _Condition= UPPER(TRIM('KPIKQI_New'[Điều kiện_TĐ])) -- chuẩn hóa RETURN IF ( NOT ISBLANK(_Result), SWITCH( TRUE(), -- Case 1: Target = 0 và cần đúng bằng 0 _Target = 0 && _Condition = \"<=\" && _Result = _Target , -1, _Condition = \">=\", IF(_Condition = \">=\"&&(_Result - _Target=0) , -1, DIVIDE(_Target - _Result, 100 - _Target, 0)), -- thêm 0 nếu chia cho 0 -- Case 3: <= _Condition = \"<=\", DIVIDE(_Result - _Target, _Target, 0), -- Case 4: = nhưng khác Target _Condition = \"=\" && _Result <> _Target , 0.9, -- Case 5: = và đúng bằng Target _Condition = \"=\" && _Result = _Target , -1, -- Nếu không match gì thì ra 0 thay vì BLANK 0 ) ) )"
