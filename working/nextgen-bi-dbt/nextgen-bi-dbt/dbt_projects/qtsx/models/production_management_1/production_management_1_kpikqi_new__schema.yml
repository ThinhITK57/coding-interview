  - name: so_with_period_n_1_td
    description: "Cột So với kỳ N-1 (TĐ) trong KPIKQI_New. Cột tính toán, DAX gốc: VAR CurrentResult = KPIKQI_New[Kết quả] -- Tháng N VAR PrevResult = KPIKQI_New[Kết quả 1 kỳ trước'] -- Tháng N-1 VAR Conditioncheck = KPIKQI_New[Điều kiện_TĐ] RETURN IF( OR( ISBLANK(CurrentResult), ISBLANK(PrevResult) ), BLANK(), SWITCH( TRUE(), -- Trường hợp >= : (Tháng N-1 - Tháng N) / (100 - Tháng N-1) Conditioncheck = \">=\", DIVIDE(PrevResult - CurrentResult, 100 - PrevResult), -- Trường hợp <= : (Tháng N - Tháng N-1) / Tháng N-1 Conditioncheck = \"<=\", DIVIDE(CurrentResult - PrevResult, PrevResult), -- Trường hợp = : Đúng bằng thì trả về 0 (Không chênh lệch), khác thì BLANK() Conditioncheck = \"=\", IF(CurrentResult = PrevResult, 0, BLANK()), BLANK() ) )"
