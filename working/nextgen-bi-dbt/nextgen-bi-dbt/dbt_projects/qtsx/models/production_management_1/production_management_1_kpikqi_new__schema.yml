version: 2
models:
- name: production_management_1_kpikqi_new
  description: "Bảng production_management_1_kpikqi_new (nguồn Power BI: KPIKQI_New)."
  meta:
    label: "KPIKQI_New"
    powerbi_source: "KPIKQI_New"
    joins:
    - join: production_management_1_target_kpikqi_tap_doan
      sql_on: "${production_management_1_kpikqi_new.spdv_fixed} = ${production_management_1_target_kpikqi_tap_doan.product_service_name}"
      relationship: many-to-many
    - join: production_management_1_sheet1
      sql_on: "${production_management_1_kpikqi_new.customer_2} = ${production_management_1_sheet1.column1}"
      relationship: many-to-one
    metrics:
      average_result_quy:
        type: average
        sql: "CASE WHEN criteria_period_type = 'Month' THEN result END"
        label: "AverageResult_Quy"
        description: "DAX: CALCULATE( AVERAGE('KPIKQI_New'[Kết quả]), 'KPIKQI_New'[CriteriaPeriodType] = \"Month\" )"
      count_distinct_sp_metric_filtered:
        type: count_distinct
        sql: "CASE WHEN (kpitype = 'Sản phẩm' AND tick_kpi = 1) THEN sp_metric END"
        label: "count_distinct sp_metric (có điều kiện)"
        description: "Metric phụ sinh từ DAX: COUNT_DISTINCT(sp_metric) kèm điều kiện của CALCULATE"
      count_distinct_sp_metric_filtered_2:
        type: count_distinct
        sql: "CASE WHEN (tag_td = 'Tập đoàn' AND tick_kpi = 1) THEN sp_metric END"
        label: "count_distinct sp_metric (có điều kiện)"
        description: "Metric phụ sinh từ DAX: COUNT_DISTINCT(sp_metric) kèm điều kiện của CALCULATE"
      max_alert_icon:
        type: max
        sql: alert_icon
        label: "Cảnh báo FAIL 2 kỳ"
        description: "Sinh từ Power BI: max(KPIKQI_New.Cảnh báo_icon)"
      max_condition:
        type: max
        sql: condition
        label: "Điều kiện"
        description: "Sinh từ Power BI: max(KPIKQI_New.Điều kiện)"
      max_kpi_trend:
        type: max
        sql: kpi_trend
        label: "Trendline"
        description: "Sinh từ Power BI: max(KPIKQI_New.Xu hướng KPI)"
      max_metric_name:
        type: max
        sql: metric_name
        label: "Metric name"
        description: "Sinh từ Power BI: max(KPIKQI_New.Metric name)"
      max_report_date:
        type: max
        sql: report_date_2
        label: "Ngày báo cáo mới nhất"
        description: "Thay cho measure text '[Báo cáo tuần_new]' (DAX ghép chuỗi \"Báo cáo tuần: Tuần N (dd/MM/yyyy - dd/MM/yyyy)\"). Lightdash không nên có metric kiểu chuỗi; dựng dòng tiêu đề bằng Markdown tile trên dashboard, hoặc Big value trên metric này."
      min_alert_icon:
        type: min
        sql: alert_icon
        label: "Cảnh báo"
        description: "Sinh từ Power BI: min(KPIKQI_New.Cảnh báo_icon)"
      quantity_kh_cai_thien:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN tick_kpi = 1 THEN customer_2 END) - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND (kpi_trend IS NULL OR kpi_trend <> 'Cải thiện') THEN customer_2 END)"
        label: "Số lượng KH Cải thiện"
        description: "DAX: đếm khách có ImproveRate = 1, tức MỌI dòng TickKPI=1 đều có [Xu hướng KPI] = \"Cải thiện\". Viết bằng \"tập khách có TickKPI=1\" trừ đi \"tập khách có ít nhất một dòng KHÔNG phải Cải thiện\"."
      quantity_kh_suy_giam:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN tick_kpi = 1 THEN customer_2 END) - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND (kpi_trend IS NULL OR kpi_trend <> 'Suy giảm') THEN customer_2 END)"
        label: "Số lượng KH Suy giảm"
        description: "DAX: đếm khách có FailRate = 1, tức MỌI dòng TickKPI=1 đều có [Xu hướng KPI] = \"Suy giảm\"."
      result_fact:
        type: max
        sql: result
        label: "Kết quả fact"
        description: "DAX: SELECTEDVALUE('KPIKQI_New'[Kết quả]). SELECTEDVALUE trả giá trị khi nhóm chỉ còn 1 dòng, ngược lại BLANK; ở đây dùng MAX — trùng kết quả khi bảng đã chi tiết tới mức 1 dòng/chỉ tiêu (đúng với các bảng đang dùng nó)."
      result_prev_1_period_fact:
        type: max
        sql: result_prev_1_period
        label: "Kết quả 1 kỳ trước fact"
        description: "DAX: SELECTEDVALUE('KPIKQI_New'[Kết quả 1 kỳ trước])"
      result_prev_2_periods_fact:
        type: max
        sql: result_prev_2_periods
        label: "Kết quả 2 kỳ trước fact"
        description: "DAX: SELECTEDVALUE('KPIKQI_New'[Kết quả 2 kỳ trước])"
      target_dim:
        type: max
        sql: target_fin
        label: "Target_dim"
        description: "DAX: SELECTEDVALUE('KPIKQI_New'[Target_fin])"
      tong_count_dv:
        type: count_distinct
        sql: "CASE WHEN kpitype <> 'Sản phẩm' THEN metric_name END"
        label: "Tổng số DV"
        description: "DAX: CALCULATE( DISTINCTCOUNT('KPIKQI_New'[Metric name]), FILTER( KPIKQI_New, 'KPIKQI_New'[KPITYPE]<> \"Sản phẩm\"))"
      tong_count_dv_kh:
        type: count_distinct
        sql: dv_customer
        label: "Tổng số DV-KH"
        round: 0
        description: "DAX: CALCULATE( DISTINCTCOUNT('KPIKQI_New'[DV-KHÁCH HÀNG]))"
      tong_count_dv_khong_passed:
        type: count_distinct
        sql: "CASE WHEN (evaluation <> '1. Đạt' AND kpitype <> 'Sản phẩm') THEN metric_name END"
        label: "Tổng số DV Không Đạt"
        description: "DAX: CALCULATE( DISTINCTCOUNT('KPIKQI_New'[Metric name]), FILTER( KPIKQI_New, 'KPIKQI_New'[ĐÁNH GIÁ]<>\"1. Đạt\" && 'KPIKQI_New'[KPITYPE]<> \"Sản phẩm\"))"
      tong_count_sp:
        type: count_distinct
        sql: "CASE WHEN kpitype = 'Sản phẩm' THEN sp_metric END"
        label: "Tổng số SP"
        description: "DAX: CALCULATE( DISTINCTCOUNT('KPIKQI_New'[SP-Metric]), 'KPIKQI_New'[KPITYPE] = \"Sản phẩm\" )"
      tong_count_sp_fixed:
        type: number
        sql: "COALESCE(${count_distinct_sp_metric_filtered}, 0)"
        label: "Tổng số SP_Fixed"
        description: "DAX: COALESCE( CALCULATE( DISTINCTCOUNT('KPIKQI_New'[SP-Metric]), 'KPIKQI_New'[KPITYPE] = \"Sản phẩm\" && 'KPIKQI_New'[TickKPI]=1 ), 0 )"
      tong_count_sp_khong_passed:
        type: count_distinct
        sql: "CASE WHEN evaluation_passed = 'Không đạt' THEN customer_spdv END"
        label: "Tổng số SP Không Đạt"
        description: "DAX: đếm cặp [KHách hàng - SPDV] có FailRate <> 0, tức có ít nhất một dòng \"Không đạt\"."
      tong_count_sp_passed:
        type: number
        sql: "COUNT(DISTINCT customer_spdv) - COUNT(DISTINCT CASE WHEN evaluation_passed = 'Không đạt' THEN customer_spdv END)"
        label: "Tổng số SP Đạt"
        description: "DAX: đếm cặp [KHách hàng - SPDV] có FailRate = 0 (không có dòng \"Không đạt\" nào)."
      tong_count_spdv_td:
        type: number
        sql: "COALESCE(${count_distinct_sp_metric_filtered_2}, 0)"
        label: "Tổng số SPDV_TĐ"
        round: 0
        description: "DAX: COALESCE( CALCULATE( DISTINCTCOUNT('KPIKQI_New'[SP-Metric]), 'KPIKQI_New'[Tag_TĐ] = \"Tập đoàn\" && 'KPIKQI_New'[TickKPI]=1 ), 0 )"
      tong_customer:
        type: count_distinct
        sql: "CASE WHEN customer_2 IS NOT NULL AND customer_2 <> '' THEN customer_2 END"
        label: "Tổng khách hàng"
        description: "DAX: CALCULATE(DISTINCTCOUNT('KPIKQI_New'[Khách hàng]), 'KPIKQI_New'[Khách hàng]<>BLANK())"
      tong_kh_passed_month_n:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN tick_kpi = 1 THEN customer_2 END) - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND evaluation_passed = 'Không đạt' THEN customer_2 END)"
        label: "Tổng KH Đạt Tháng N"
        description: "DAX: cùng công thức với [Tổng khách Đạt] (đếm khách có FailRate = 0). Power BI khai hai measure trùng nhau; giữ cả hai tên vì chart gốc dùng cả hai."
      tong_khach_khong_passed:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN customer_2 IS NOT NULL AND customer_2 <> '' THEN customer_2 END) - (COUNT(DISTINCT CASE WHEN tick_kpi = 1 THEN customer_2 END)
   - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND evaluation_passed = 'Không đạt' THEN customer_2 END))"
        label: "Tổng khách Không Đạt"
        description: "DAX: 'KPIKQI_New'[Tổng khách hàng] - 'KPIKQI_New'[Tổng khách Đạt]"
      tong_khach_passed:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN tick_kpi = 1 THEN customer_2 END) - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND evaluation_passed = 'Không đạt' THEN customer_2 END)"
        label: "Tổng khách Đạt"
        description: "DAX: đếm khách có FailRate = 0, với FailRate = DIVIDE(số dòng \"Không đạt\" & TickKPI=1, số dòng TickKPI=1, 1). Tham số thứ 3 = 1 nghĩa là khách KHÔNG có dòng TickKPI=1 nào thì coi như trượt -> ở đây thể hiện bằng cách lấy tập khách có TickKPI=1 rồi trừ đi tập khách có ít nhất một dòng \"Không đạt\"."
      tong_khach_passed_period_n_1:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN customer_2 IS NOT NULL AND customer_2 <> '' THEN customer_2 END) - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND evaluation_passed_prev_1_period = 'Không đạt' THEN customer_2 END)"
        label: "Tổng khách Đạt KỲ N-1"
        description: "DAX: như [Tổng khách Đạt] nhưng dùng [Đánh giá đạt 1 kỳ trước] và DIVIDE(..., 0) — tham số thứ 3 = 0 nên khách không có dòng TickKPI=1 vẫn tính là Đạt, vì vậy mẫu số là TOÀN BỘ khách chứ không chỉ khách có TickKPI=1."
      tong_khach_passed_period_n_2:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN customer_2 IS NOT NULL AND customer_2 <> '' THEN customer_2 END) - COUNT(DISTINCT CASE WHEN tick_kpi = 1 AND evaluation_passed_prev_2_periods = 'Không đạt' THEN customer_2 END)"
        label: "Tổng khách Đạt KỲ N-2"
        description: "DAX: như [Tổng khách Đạt KỲ N-1] nhưng dùng [Đánh giá đạt 2 kỳ trước]."
      tong_sp:
        type: count_distinct
        sql: customer_spdv
        label: "Tổng SP"
        description: "DAX: CALCULATE ( DISTINCTCOUNT ( 'KPIKQI_New'[KHách hàng - SPDV]) )"
  columns:
  - name: spdv
    description: "Cột SPDV trong KPIKQI_New."
    meta:
      dimension:
        type: string
        label: "SPDV"
  - name: metric_name
    description: "Cột Metric name trong KPIKQI_New."
    meta:
      dimension:
        type: string
        label: "Metric name"
  - name: criteria_period_type
    description: "Cột CriteriaPeriodType trong KPIKQI_New."
    meta:
      dimension:
        type: string
        label: "CriteriaPeriodType"
  - name: result
    description: "Cột Kết quả trong KPIKQI_New."
    meta:
      dimension:
        type: number
        label: "Kết quả"
  - name: target
    description: "Cột Target trong KPIKQI_New."
    meta:
      dimension:
        type: number
        label: "Target"
        hidden: true
  - name: unit
    description: "Cột Đơn vị trong KPIKQI_New."
    meta:
      dimension:
        type: string
        label: "Đơn vị"
  - name: condition
    description: "Cột Điều kiện trong KPIKQI_New."
    meta:
      dimension:
        type: string
        label: "Điều kiện"
  - name: report_date
    description: "Cột Ngày_báo_cáo_18900 trong KPIKQI_New."
    meta:
      dimension:
        type: timestamp
        label: "Ngày_báo_cáo_18900"
        hidden: true
  - name: end_time
    description: "Cột EndTime trong KPIKQI_New."
    meta:
      dimension:
        type: date
        label: "EndTime"
        hidden: true
  - name: customer_type
    description: "Cột CustomerType trong KPIKQI_New."
    meta:
      dimension:
        type: string
        label: "CustomerType"
  - name: report_date_2
    description: "Cột Ngày báo cáo trong KPIKQI_New. Cột tính toán, DAX gốc: IF( 'KPIKQI_New'[EndTime] = DATE(2025, 9, 30), DATE(2025, 9, 28), IF( NOT ISBLANK('KPIKQI_New'[EndTime]), 'KPIKQI_New'[EndTime], 'KPIKQI_New'[Ngày_báo_cáo_18900] ) )"
    meta:
      dimension:
        type: date
        label: "Ngày báo cáo"
  - name: customer_group
    description: "Cột Nhóm Khách hàng trong KPIKQI_New. Cột tính toán, DAX gốc: IF((('KPIKQI_New'[Khách hàng] = \"Viettel\") || ('KPIKQI_New'[SPDV]= \"TI Sản phẩm\")|| CONTAINSSTRING('KPIKQI_New'[SPDV],\"SE\")||('KPIKQI_New'[Metric name]=\"Tỷ lệ người dùng không gặp lỗi Crash (Crash-free users)\")||('KPIKQI_New'[Metric name]=\"Tỷ lệ người dùng không gặp lỗi Crash (Crash-free users) - Android\")||('KPIKQI_New'[Metric name]=\"Tỷ lệ người dùng không gặp lỗi Crash (Crash-free users) - iOS\")), IF(('KPIKQI_New'[SPDV]= \"SOAR\"&&'KPIKQI_New'[Ngày_báo_cáo_18900]=BLANK()&&'KPIKQI_New'[EndTime]<=DATE(2026,03,02)),\"\",\"Viettel\"), IF('KPIKQI_New'[Khách hàng]=\"SOC Platform\",IF(('KPIKQI_New'[SPDV]=\"SOC Platform\"||'KPIKQI_New'[SPDV]=\"EDR\"),\"SOCP\",\"\"),\"KHÁCH HÀNG NGOÀI\")) --KPIKQI sau ngày 10/11/2025: --SOCP: EDR + SOCP --EDR: Kết quả từ Tool --SOCP: kết quả từ Jira 100% --Viettel: --SOAR lấy kết quả từ Jira 100% theo 4 chỉ số mới --Các SP khác: Giữ nguyên. --Khách hàng ngoài giữ nguyên cách đo như cũ -- Cập nhật 31/12/2025: Bổ sung SOC Platform cho VIP/VVIP --Update 13/3/2026: --SOAR: Lấy 4 chỉ số từ Auto tool bắt đầu từ tuần 02/03/2026: 4 metric bao gồm: --Độ khả dụng của dịch vụ --Tốc độ đồng bộ cảnh báo từ hệ thống thành phần về SOAR --Tỷ lệ giao dịch thành công của hệ thống --Tỷ lệ cảnh báo được xử lý tự động"
    meta:
      dimension:
        type: string
        label: "Nhóm Khách hàng"
  - name: period_result
    description: "Cột PeriodResult trong KPIKQI_New. Cột tính toán, DAX gốc: SWITCH( TRUE(), 'KPIKQI_New'[CriteriaPeriodType] = \"Week\", CALCULATE( MAX('Dim_Date'[Tuần]), FILTER('Dim_Date', 'Dim_Date'[Date] = 'KPIKQI_New'[Ngày báo cáo]) ), 'KPIKQI_New'[CriteriaPeriodType] = \"Month\", CALCULATE( MAX('Dim_Date'[MonthYear]), FILTER('Dim_Date', 'Dim_Date'[Date] = 'KPIKQI_New'[Ngày báo cáo]) ), 'KPIKQI_New'[CriteriaPeriodType] = \"Quarter\", CALCULATE( MAX('Dim_Date'[QuarterYear]), FILTER('Dim_Date', 'Dim_Date'[Date] = 'KPIKQI_New'[Ngày báo cáo]) ) )"
    meta:
      dimension:
        type: string
        label: "PeriodResult"
  - name: vs_target
    description: "Cột So với target trong KPIKQI_New. Cột tính toán, DAX gốc: IF('KPIKQI_New'[Metric name] = \"MTTD VCS (giờ)\",-1, VAR _Target = 'KPIKQI_New'[Target_fin] VAR _Result = ROUND('KPIKQI_New'[Kết quả],2) VAR _Condition= UPPER(TRIM('KPIKQI_New'[Điều kiện_Target])) -- chuẩn hóa RETURN IF ( NOT ISBLANK(_Result), SWITCH( TRUE(), -- Case 1: Target = 0 và cần đúng bằng 0 _Target = 0 && _Condition = \"<=\" && _Result = _Target , -1, _Condition = \">=\", IF(_Condition = \">=\"&&(_Result - _Target=0) , -1, DIVIDE(_Target - _Result, 100 - _Target, 0)), -- thêm 0 nếu chia cho 0 -- Case 3: <= _Condition = \"<=\", DIVIDE(_Result - _Target, _Target, 0), -- Case 4: = nhưng khác Target _Condition = \"=\" && _Result <> _Target , 0.9, -- Case 5: = và đúng bằng Target _Condition = \"=\" && _Result = _Target , -1, -- Nếu không match gì thì ra 0 thay vì BLANK 0 ) ) )"
    meta:
      dimension:
        type: number
        label: "So với target"
        hidden: true
  - name: evaluation
    description: "Cột ĐÁNH GIÁ trong KPIKQI_New. Cột tính toán, DAX gốc: IF( 'KPIKQI_New'[Kết quả]='KPIKQI_New'[Target_fin],\"1. Đạt\", IF( 'KPIKQI_New'[So với Target]<> BLANK(), SWITCH( TRUE(), 'KPIKQI_New'[So với Target] = 0, \"1. Đạt\", 'KPIKQI_New'[So với Target] >= 0.6, \"4. Fail vượt Target >=60%\", 'KPIKQI_New'[So với Target] >= 0.3 && 'KPIKQI_New'[So với Target] < 0.6,\"3. Fail vượt Target >=30% & <60%\", 'KPIKQI_New'[So với Target] > 0 && 'KPIKQI_New'[So với Target] < 0.3, \"2. Fail vượt Target 0-30%\", 'KPIKQI_New'[So với Target] < 0, \"1. Đạt\", \"CHƯA CÓ KẾT QUẢ\")))"
    meta:
      dimension:
        type: string
        label: "ĐÁNH GIÁ"
  - name: updated_at
    description: "Cột UpdatedAt trong KPIKQI_New."
    meta:
      dimension:
        type: timestamp
        label: "UpdatedAt"
        hidden: true
  - name: flag
    description: "Cột Flag trong KPIKQI_New. Cột tính toán, DAX gốc: IF('KPIKQI_New'[Metric name]=BLANK(),0, IF('KPIKQI_New'[Metric name]=\"Mức độ ảnh hưởng đến hoạt động của khách hàng\",1, IF(('KPIKQI_New'[SPDV]=\"SOAR\"&&'KPIKQI_New'[Ngày báo cáo]>=DATE(2025,10,11)&&'KPIKQI_New'[Ngày báo cáo]<>BLANK()&&'KPIKQI_New'[Kết quả]<>0),1, IF(('KPIKQI_New'[SPDV]=\"SOAR\"&&'KPIKQI_New'[Ngày báo cáo]>=DATE(2026,03,02)&&('KPIKQI_New'[Metric name]<>\"Độ khả dụng của dịch vụ\"||'KPIKQI_New'[Metric name]<>\"Tốc độ đồng bộ cảnh báo từ hệ thống thành phần về SOAR\"||'KPIKQI_New'[Metric name]<>\"Tỷ lệ giao dịch thành công của hệ thống\"||'KPIKQI_New'[Metric name] <>\"Tỷ lệ cảnh báo được xử lý tự động\")),0, IF((('KPIKQI_New'[Metric name] = \"Độ khả dụng thành phần forwarder\")||('KPIKQI_New'[Metric name] = \"MTTD VCS (giờ)\")),1, IF(('KPIKQI_New'[Đơn vị]=\"%\"&&'KPIKQI_New'[Kết quả]=0 && 'KPIKQI_New'[Target_fin]>0),0, VAR CurrentDate = 'KPIKQI_New'[Ngày báo cáo] VAR CurrentSP = 'KPIKQI_New'[DV-KHÁCH HÀNG] VAR PeriodType = 'KPIKQI_New'[CriteriaPeriodType] VAR CurrentId = 'KPIKQI_New'[Id] -- Lọc nhóm theo SP-Metric, Ngày báo cáo và Điều kiện VAR GroupedData = FILTER( 'KPIKQI_New', 'KPIKQI_New'[DV-KHÁCH HÀNG] = CurrentSP && 'KPIKQI_New'[Ngày báo cáo] = CurrentDate && 'KPIKQI_New'[CriteriaPeriodType] = PeriodType ) -- Kiểm tra số lượng bản ghi trong nhóm VAR GroupCount = COUNTROWS(GroupedData) -- Nếu nhóm chỉ có 1 bản ghi, đánh dấu 1 VAR Result = IF( GroupCount = 1, 1, -- Nếu chỉ có 1 bản ghi trong nhóm, trả về 1 IF( CurrentId = MAXX(GroupedData, 'KPIKQI_New'[Id]), -- Nếu là dòng có Id lớn nhất trong nhóm 1, -- Dòng có Id lớn nhất đánh dấu 1 0 -- Các dòng còn lại đánh dấu 0 ) ) RETURN Result )))))) --KPIKQI sau ngày 10/11/2025: --SOCP: EDR + SOCP --EDR: Kết quả từ Tool --SOCP: kết quả từ Jira 100% --Viettel: --SOAR lấy kết quả từ Jira 100% theo 4 chỉ số mới --Các SP khác: Giữ nguyên. --Khách hàng ngoài giữ nguyên cách đo như cũ --Update 13/3/2026: --SOAR: Lấy 4 chỉ số từ Auto tool bắt