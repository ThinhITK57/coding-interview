  - name: on_time_check_snapshot
    description: "Cột Kiểm tra đúng hạn_snapshot trong PYC-Snapshot. Cột tính toán, DAX gốc: IF(('PYC-Snapshot'[Ngày_hoàn_thành_nghiệm_thu_10805]-'PYC-Snapshot'[Ngày Commit Lịch sử])<=0,\"Pass\",\"Fail\")"
    meta:
      dimension:
        type: string
        label: "Kiểm tra đúng hạn_snapshot"
        hidden: true
  - name: check_monthly_commit
    description: "Cột Check Commit Tháng trong PYC-Snapshot. Cột tính toán, DAX gốc: VAR CurrentIssue = 'PYC-Snapshot'[ISSUE_KEY] VAR CurrentDate = 'PYC-Snapshot'[Ngày Commit Lịch sử] VAR CurrentLan = 'PYC-Snapshot'[Lần chỉnh sửa lịch sử] VAR CurrentMonth = YEAR(CurrentDate) * 100 + MONTH(CurrentDate) VAR MaxLanInMonth = CALCULATE( MAX('PYC-Snapshot'[Lần chỉnh sửa lịch sử]), FILTER( 'PYC-Snapshot', 'PYC-Snapshot'[ISSUE_KEY] = CurrentIssue && NOT ISBLANK('PYC-Snapshot'[Ngày Commit Lịch sử]) && YEAR('PYC-Snapshot'[Ngày Commit Lịch sử]) * 100 + MONTH('PYC-Snapshot'[Ngày Commit Lịch sử]) = CurrentMonth ) ) RETURN IF( NOT ISBLANK(CurrentDate) && CurrentLan = MaxLanInMonth, 1, 0 )"
    meta:
      dimension:
        type: number
        label: "Check Commit Tháng"
        hidden: true
