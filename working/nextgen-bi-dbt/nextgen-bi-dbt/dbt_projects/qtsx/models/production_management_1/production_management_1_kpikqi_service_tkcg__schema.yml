        sql: latest_version_coverage_tkcg
        label: "ĐỘ PHỦ PHIÊN BẢN MỚI NHẤT"
        description: "Sinh từ Power BI: average(KPIKQI Dịch vụ TKCG.Độ phủ Phiên bản mới nhất_ TKCG)"
      max_latest_version:
        type: max
        sql: latest_version
        label: "Latest Version"
        description: "Sinh từ Power BI: max(KPIKQI Dịch vụ TKCG.Latest_Version_20405)"
