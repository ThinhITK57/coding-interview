  - name: agent_online
    description: "Cột Agent_online_20410 trong KPIKQI Dịch vụ TKCG."
    meta:
      dimension:
        type: number
        label: "Agent_online_20410"
        hidden: true
  - name: exception_reason
    description: "Cột Lý_do_exception_20412 trong KPIKQI Dịch vụ TKCG."
    meta:
      dimension:
