  meta:
    label: "KPIKQI Dịch vụ TKCG"
    powerbi_source: "KPIKQI Dịch vụ TKCG"
    joins:
    - join: production_management_1_vvip
      sql_on: "${production_management_1_kpikqi_service_tkcg.issue_summary} = ${production_management_1_vvip.org_name}"
