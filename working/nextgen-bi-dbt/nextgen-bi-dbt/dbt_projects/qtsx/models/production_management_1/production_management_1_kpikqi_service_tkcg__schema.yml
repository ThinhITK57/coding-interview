        hidden: true
  - name: update_frequency
    description: "Cột Tần_suất_update_20402 trong KPIKQI Dịch vụ TKCG."
    meta:
      dimension:
        type: string
        label: "Tần_suất_update_20402"
        hidden: true
  - name: report_date_2
    description: "Cột Ngày báo cáo trong KPIKQI Dịch vụ TKCG. Cột tính toán, DAX gốc: IF( WEEKDAY('KPIKQI Dịch vụ TKCG'[Ngày_báo_cáo_18900].[Date],2) = 1, 'KPIKQI Dịch vụ TKCG'[Ngày_báo_cáo_18900] - 1, 'KPIKQI Dịch vụ TKCG'[Ngày_báo_cáo_18900].[Date])"
    meta:
      dimension:
        type: date
        label: "Ngày báo cáo"
        hidden: true
  - name: latest_version_coverage_tkcg
    description: "Cột Độ phủ Phiên bản mới nhất_ TKCG trong KPIKQI Dịch vụ TKCG. Cột tính toán, DAX gốc: IF( 'KPIKQI Dịch vụ TKCG'[Latest_Version_20405] = 'KPIKQI Dịch vụ TKCG'[Version_12333], DIVIDE('KPIKQI Dịch vụ TKCG'[Agent_latest_20409],'KPIKQI Dịch vụ TKCG'[Agent_online_20410]),BLANK())"
    meta:
      dimension:
        type: number
        label: "Độ phủ Phiên bản mới nhất_ TKCG"
        hidden: true
  - name: tick_month
    description: "Cột Tick Month trong KPIKQI Dịch vụ TKCG. Cột tính toán, DAX gốc: VAR MaxDateInMonth = CALCULATE ( MAX ( 'KPIKQI Dịch vụ TKCG'[Ngày báo cáo] ), ALLEXCEPT ( 'KPIKQI Dịch vụ TKCG', 'KPIKQI Dịch vụ TKCG'[Sản_phẩm_20403], 'KPIKQI Dịch vụ TKCG'[MonthKey] ) ) RETURN IF ( 'KPIKQI Dịch vụ TKCG'[Ngày báo cáo] = MaxDateInMonth, 1, 0 )"
    meta:
      dimension:
        type: number
        label: "Tick Month"
        hidden: true
  - name: month_key
    description: "Cột MonthKey trong KPIKQI Dịch vụ TKCG. Cột tính toán, DAX gốc: YEAR('KPIKQI Dịch vụ TKCG'[Ngày báo cáo])*100 + MONTH('KPIKQI Dịch vụ TKCG'[Ngày báo cáo])"
    meta:
      dimension:
        type: number
        label: "MonthKey"
        hidden: true
  - name: quarter
    description: "Cột Quý trong KPIKQI Dịch vụ TKCG. Cột tính toán, DAX gốc: LOOKUPVALUE('Dim_Date'[QuarterYear],Dim_Date[Date],'KPIKQI Dịch vụ TKCG'[Ngày báo cáo])"
    meta:
      dimension:
        type: string
        label: "Quý"
        hidden: true
  - name: tick_quarter
    description: "Cột Tick Quý trong KPIKQI Dịch vụ TKCG. Cột tính toán, DAX gốc: VAR CurrDate = 'KPIKQI Dịch vụ TKCG'[Ngày báo cáo] VAR CurrProduct = 'KPIKQI Dịch vụ TKCG'[Sản_phẩm_20403] VAR CurrQuarter = 'KPIKQI Dịch vụ TKCG'[Quý] -- Tháng lớn nhất (MonthKey) trong cùng Quý + cùng Sản phẩm VAR MaxMonthInQuarter = CALCULATE( MAX( 'KPIKQI Dịch vụ TKCG'[MonthKey] ), FILTER( ALL( 'KPIKQI Dịch vụ TKCG' ), 'KPIKQI Dịch vụ TKCG'[Sản_phẩm_20403] = CurrProduct && 'KPIKQI Dịch vụ TKCG'[Quý] = CurrQuarter ) ) -- Lấy ngày lớn nhất trong tháng đó VAR MaxDateInThatMonth = CALCULATE( MAX( 'KPIKQI Dịch vụ TKCG'[Ngày báo cáo] ), FILTER( ALL( 'KPIKQI Dịch vụ TKCG' ), 'KPIKQI Dịch vụ TKCG'[Sản_phẩm_20403] = CurrProduct && 'KPIKQI Dịch vụ TKCG'[MonthKey] = MaxMonthInQuarter ) ) RETURN IF( CurrDate = MaxDateInThatMonth, 1, 0 )"
    meta:
      dimension:
        type: number
        label: "Tick Quý"
        hidden: true
