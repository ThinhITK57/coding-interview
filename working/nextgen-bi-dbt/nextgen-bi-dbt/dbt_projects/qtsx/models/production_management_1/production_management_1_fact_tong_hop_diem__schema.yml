version: 2
models:
- name: production_management_1_fact_tong_hop_diem
  description: "Bảng production_management_1_fact_tong_hop_diem (nguồn Power BI: fact_tong_hop_diem)."
  meta:
    label: "fact_tong_hop_diem"
    powerbi_source: "fact_tong_hop_diem"
    joins:
    - join: production_management_1_contact
      sql_on: "${production_management_1_fact_tong_hop_diem.email} = ${production_management_1_contact.email}"
      relationship: many-to-one
    - join: production_management_1_n_5_vvipkpicx
      sql_on: "${production_management_1_fact_tong_hop_diem.spdv} = ${production_management_1_n_5_vvipkpicx.spdv}"
      relationship: many-to-one
    metrics:
      average_csat_product_quality:
        type: average
        sql: csat_product_quality
        label: "CSAT CLDV"
        description: "Sinh từ Power BI: average(fact_tong_hop_diem.CSAT chất lượng SPDV)"
      average_nps_score:
        type: average
        sql: nps_score
        label: "Average of NPS Score"
        description: "Sinh từ Power BI: average(fact_tong_hop_diem.NPS Score)"
      stddev_csat_avg:
        type: number
        sql: "STDDEV(${TABLE}.csat_avg)"
        label: "Standard deviation of CSAT Avg"
        description: "Sinh từ Power BI: stddev(fact_tong_hop_diem.CSAT Avg)"
      sum_csat_score:
        type: sum
        sql: csat_score
        label: "Sum of CSAT Score (%)"
        description: "Sinh từ Power BI: sum(fact_tong_hop_diem.CSAT Score (%))"
  columns:
