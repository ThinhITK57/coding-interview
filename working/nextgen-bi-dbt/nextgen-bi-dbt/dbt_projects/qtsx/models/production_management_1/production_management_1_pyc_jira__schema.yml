    meta:
      dimension:
        type: string
        label: "Đơn_hàng_10707"
        hidden: true
  - name: end_date_commit
    description: "Cột EndDate_commit trong PYC Jira. Cột tính toán, DAX gốc: 'PYC Jira'[Ngày_TTSX_commit_10845]"
    meta:
      dimension:
        type: date
        label: "EndDate_commit"
        hidden: true
  - name: post_acceptance_defect_count_weighted
    description: "Cột Số Lỗi Sau Nghiệm thu (đã nhân hệ số) trong PYC Jira. Cột tính toán, DAX gốc: CALCULATE( SUM('Bug sau nghiệm thu'[Hệ số lỗi]), FILTER('Bug sau nghiệm thu',MONTH('Bug sau nghiệm thu'[Date_created])=MONTH('PYC Jira'[EndDate_commit])&&YEAR('Bug sau nghiệm thu'[Date_created])=YEAR('PYC Jira'[EndDate_commit])&&'Bug sau nghiệm thu'[TTSX_PRODUCT_16800]='PYC Jira'[Dự_án_10706]))"
    meta:
      dimension:
        type: number
        label: "Số Lỗi Sau Nghiệm thu (đã nhân hệ số)"
        hidden: true
  - name: post_acceptance_bug_count
    description: "Cột Số Bug sau nghiệm thu trong PYC Jira. Cột tính toán, DAX gốc: CALCULATE( DISTINCTCOUNTNOBLANK('Bug sau nghiệm thu'[Id]), FILTER('Bug sau nghiệm thu',MONTH('Bug sau nghiệm thu'[Date_created])=MONTH('PYC Jira'[EndDate_commit])&&YEAR('Bug sau nghiệm thu'[Date_created])=YEAR('PYC Jira'[EndDate_commit])&&'Bug sau nghiệm thu'[TTSX_PRODUCT_16800]='PYC Jira'[Dự_án_10706]))"
    meta:
