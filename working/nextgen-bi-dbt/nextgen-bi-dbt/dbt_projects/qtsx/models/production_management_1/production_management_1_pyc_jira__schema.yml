version: 2
models:
- name: production_management_1_pyc_jira
  description: "Bảng production_management_1_pyc_jira (nguồn Power BI: PYC Jira)."
  meta:
    label: "PYC Jira"
    powerbi_source: "PYC Jira"
    joins:
    - join: production_management_1_os_mm_plan
      sql_on: "${production_management_1_pyc_jira.ttsx_product} = ${production_management_1_os_mm_plan.ttsx_product}"
      relationship: many-to-many
    metrics:
      commit_hien_tai:
        type: max
        sql: ttsx_pm_commit_date
        label: "Commit hiện tại"
        description: "DAX: MAX('PYC Jira'[Ngày_PM_TTSX_commit_10808])"
      count_issue_key:
        type: count
        sql: issue_key
        label: "Số phiếu"
        description: "Sinh từ Power BI: count(PYC Jira.ISSUE_KEY)"
      mm_pyc_done_mm_actual_ttsx:
        type: sum
        sql: "CASE WHEN issue_current_status_name = 'Done' THEN mm_pyc END"
        label: "MM PYC DONE - MM ACTUAL TTSX"
        description: "DAX: CALCULATE( SUM('PYC Jira'[MM_PYC_10705]), 'PYC Jira'[ISSUE_CURRENT_STATUS_NAME]=\"Done\")"
      post_acceptance_bug_count_weighted:
        type: sum
        sql: post_acceptance_defect_count_weighted
        label: "Số Bug sau nghiệm thu đã nhân hệ số"
        description: "DAX: CALCULATE( SUM('PYC Jira'[Số Lỗi Sau Nghiệm thu (đã nhân hệ số)]))"
      tong_count_pyc:
        type: count_distinct
        sql: issue_key
        label: "Tổng số PYC"
        description: "DAX: DISTINCTCOUNT('PYC Jira'[ISSUE_KEY])"
  columns:
  - name: id
    description: "Cột Id trong PYC Jira."
    meta:
      dimension:
        type: number
        label: "Id"
        hidden: true
  - name: issue_key
    description: "Cột ISSUE_KEY trong PYC Jira."
    meta:
      dimension:
        type: string
        label: "ISSUE_KEY"
        hidden: true
  - name: issue_current_type_name
    description: "Cột ISSUE_CURRENT_TYPE_NAME trong PYC Jira."
    meta:
      dimension:
        type: string
        label: "ISSUE_CURRENT_TYPE_NAME"
        hidden: true
  - name: issue_created
    description: "Cột ISSUE_CREATED trong PYC Jira."
    meta:
      dimension:
        type: timestamp
        label: "ISSUE_CREATED"
        hidden: true
  - name: issue_summary
    description: "Cột ISSUE_SUMMARY trong PYC Jira."
    meta:
      dimension:
        type: string
        label: "ISSUE_SUMMARY"
        hidden: true
  - name: issue_current_status_name
    description: "Cột ISSUE_CURRENT_STATUS_NAME trong PYC Jira."
    meta:
      dimension:
        type: string
        label: "Status"
  - name: issue_current_assignee_name
    description: "Cột ISSUE_CURRENT_ASSIGNEE_NAME trong PYC Jira."
    meta:
      dimension:
        type: string
        label: "PM"
  - name: internal_due_date
    description: "Cột Due_date_nội_bộ_10613 trong PYC Jira."
    meta:
      dimension:
        type: timestamp
        label: "Due_date_nội_bộ_10613"
        hidden: true
  - name: project
    description: "Cột Dự_án_10706 trong PYC Jira."
    meta:
      dimension:
        type: string
        label: "PROJECT"
  - name: mm_pyc
    description: "Cột MM_PYC_10705 trong PYC Jira."
    meta:
      dimension:
        type: number
        label: "MM_PYC_10705"
        hidden: true
  - name: request_created_date
    description: "Cột Ngày_tạo_PYC_10708 trong PYC Jira."
    meta:
      dimension:
        type: date
        label: "Ngày_tạo_PYC_10708"
        hidden: true
  - name: on_time_check
