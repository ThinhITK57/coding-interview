version: 2
models:
- name: production_management_1_kpikqi_all
  description: "Bảng production_management_1_kpikqi_all (nguồn Power BI: KPIKQI_ALL)."
  meta:
    label: "KPIKQI_ALL"
    powerbi_source: "KPIKQI_ALL"
    metrics:
      tong_count_dv_fixed:
        type: count_distinct
        sql: "CASE WHEN kpi_type <> 'Sản phẩm' THEN metric_name END"
        label: "Tổng số DV_Fixed"
        description: "DAX: COALESCE(CALCULATE(DISTINCTCOUNT('KPIKQI_ALL'[Metric name]), 'KPIKQI_New'[KPITYPE] <> \"Sản phẩm\"), 0). KHÁC BẢN GỐC: bộ lọc gốc đặt trên bảng 'KPIKQI_New' nhưng hai bảng không có quan hệ nào trong DataModel, nên chuyển sang cột `kpi_type` của chính 'KPIKQI_ALL' — cùng ngữ nghĩa \"loại KPI không phải Sản phẩm\"."
      tong_count_dv_khong_passed_all:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN kpi_type <> 'Sản phẩm' THEN metric_name END) - COUNT(DISTINCT CASE WHEN kpi_type = 'Dịch vụ' AND evaluation = '1. Đạt' THEN metric_name END)"
        label: "Tổng số DV không đạt_all"
        description: "DAX: 'KPIKQI_ALL'[Tổng số DV_Fixed] - 'KPIKQI_ALL'[Tổng số DV Đạt_all]"
      tong_count_dv_passed_all:
        type: number
        sql: "COUNT(DISTINCT CASE WHEN kpi_type = 'Dịch vụ' AND evaluation = '1. Đạt' THEN metric_name END)"
        label: "Tổng số DV Đạt_all"
        description: "DAX: đếm [Metric name] có FailRate > 0, với FailRate = DIVIDE(số dòng Loại KPI=\"Dịch vụ\" & Đánh giá=\"1. Đạt\", số dòng Loại KPI=\"Dịch vụ\", 0). Biến trong DAX đặt tên \"FailDV\" nhưng điều kiện lọc là \"1. Đạt\" nên thực chất đây là \"dịch vụ ĐẠT\" — giữ đúng ngữ nghĩa của công thức, không sửa theo tên biến."
  columns:
