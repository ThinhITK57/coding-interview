  meta:
    label: "KPIKQI KHÁCH HÀNG"
    powerbi_source: "KPIKQI KHÁCH HÀNG"
    joins:
    - join: production_management_1_division
      sql_on: "${production_management_1_kpikqi_customer.center} = ${production_management_1_division.division}"
      relationship: many-to-one
    metrics:
      a_count_lan_xuat_hien_tooltip:
        type: count
        sql: "CASE WHEN (customer_group <> 'KHÁCH HÀNG NGOÀI' AND spdv <> 'Threat Intelligence') THEN 1 END"
        label: "A_Số lần xuất hiện Tooltip"
        description: "DAX: CALCULATE( COUNTROWS('KPIKQI KHÁCH HÀNG'), FILTER( 'KPIKQI KHÁCH HÀNG', 'KPIKQI KHÁCH HÀNG'[CustomerGroup] <> \"KHÁCH HÀNG NGOÀI\" && 'KPIKQI KHÁCH HÀNG'[SPDV] <> \"Threat Intelligence\" ) )"
      count_distinct_spdv:
        type: count_distinct
        sql: spdv
        label: "Số SP phụ trách"
        description: "Sinh từ Power BI: count_distinct(KPIKQI KHÁCH HÀNG.SPDV)"
      count_product_by_center:
        type: count_distinct
        sql: "CASE WHEN (spdv <> 'mSuite' OR spdv <> 'Threat Intelligence' OR spdv <> 'Cloudrity') THEN spdv END"
        label: "Số sản phẩm theo trung tâm"
        description: "DAX: CALCULATE( DISTINCTCOUNT('KPIKQI KHÁCH HÀNG'[SPDV]), 'KPIKQI KHÁCH HÀNG'[SPDV] <> \"mSuite\" || 'KPIKQI KHÁCH HÀNG'[SPDV] <> \"Threat Intelligence\" || 'KPIKQI KHÁCH HÀNG'[SPDV] <> \"Cloudrity\")"
