    description: "Cột Trung tâm trong KPIKQI KHÁCH HÀNG. Cột tính toán, DAX gốc: VAR AllValues = CALCULATETABLE ( VALUES ( 'Project vs. Department'[Khối] ), FILTER ( 'Project vs. Department', 'Project vs. Department'[Sản phẩm] = 'KPIKQI KHÁCH HÀNG'[SPDV] ) ) VAR AfterFilter = CALCULATETABLE ( VALUES ( 'Project vs. Department'[Khối] ), FILTER ( 'Project vs. Department', 'Project vs. Department'[Sản phẩm] = 'KPIKQI KHÁCH HÀNG'[SPDV] && NOT CONTAINSSTRING ( 'Project vs. Department'[ProjectName], \"OS\" ) ) ) RETURN SWITCH ( TRUE(), COUNTROWS ( AllValues ) = 1, MAXX ( AllValues, [Khối] ), COUNTROWS ( AfterFilter ) = 1, MAXX ( AfterFilter, [Khối] ), BLANK() -- Nếu vẫn nhiều giá trị thì để trống )"
