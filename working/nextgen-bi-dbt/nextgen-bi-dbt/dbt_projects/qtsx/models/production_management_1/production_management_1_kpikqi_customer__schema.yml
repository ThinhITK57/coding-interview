        type: string
        label: "PeriodResult"
        hidden: true
  - name: color
    description: "Cột Màu sắc trong KPIKQI KHÁCH HÀNG. Cột tính toán, DAX gốc: IF( NOT(ISBLANK('KPIKQI KHÁCH HÀNG'[So với target])), SWITCH( TRUE(), 'KPIKQI KHÁCH HÀNG'[So với target] >= 0.6, \"4. Fail vượt Target >=60%\", 'KPIKQI KHÁCH HÀNG'[So với target] >= 0.3 && 'KPIKQI KHÁCH HÀNG'[So với target] < 0.6, \"3. Fail vượt Target >=30% & <60%\", 'KPIKQI KHÁCH HÀNG'[So với target] > 0 && 'KPIKQI KHÁCH HÀNG'[So với target] < 0.3, \"2. Fail vượt Target 0-30%\", 'KPIKQI KHÁCH HÀNG'[So với target] <= 0, \"1. Đạt\", BLANK() ))"
    meta:
      dimension:
        type: string
        label: "Màu sắc"
        hidden: true
  - name: vs_target
    description: "Cột So với target trong KPIKQI KHÁCH HÀNG. Cột tính toán, DAX gốc: VAR _Target = 'KPIKQI KHÁCH HÀNG'[Target] VAR _Result = 'KPIKQI KHÁCH HÀNG'[Kết quả] VAR _Condition= UPPER(TRIM('KPIKQI KHÁCH HÀNG'[Điều kiện])) -- chuẩn hóa RETURN IF ( NOT ISBLANK(_Result), SWITCH( TRUE(), -- Case 1: Target = 0 và cần đúng bằng 0 _Target = 0 && _Condition = \"<=\" && _Result = _Target , -1, -- Case 2: >= _Condition = \">=\", DIVIDE(_Target - _Result, 100 - _Target, 0), -- thêm 0 nếu chia cho 0 -- Case 3: <= _Condition = \"<=\", DIVIDE(_Result - _Target, _Target, 0), -- Case 4: = nhưng khác Target _Condition = \"=\" && _Result <> _Target , 0.9, -- Case 5: = và đúng bằng Target _Condition = \"=\" && _Result = _Target , -1, -- Nếu không match gì thì ra 0 thay vì BLANK 0 ) )"
    meta:
      dimension:
        type: string
        label: "So với target"
