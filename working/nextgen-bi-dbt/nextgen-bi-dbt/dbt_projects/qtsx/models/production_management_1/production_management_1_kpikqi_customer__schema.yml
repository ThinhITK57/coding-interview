    description: "Cột IsLatest trong KPIKQI KHÁCH HÀNG. Cột tính toán, DAX gốc: VAR CurrentDate = 'KPIKQI KHÁCH HÀNG'[Ngày Báo cáo] VAR CurrentSPDV = 'KPIKQI KHÁCH HÀNG'[SP-DV] VAR CurrentMetric = 'KPIKQI KHÁCH HÀNG'[Metric] VAR CurrentUpdate = 'KPIKQI KHÁCH HÀNG'[UpdatedAt] VAR CurrentID = 'KPIKQI KHÁCH HÀNG'[Id] -- Lấy Id lớn nhất trong nhóm VAR MaxID = CALCULATE( MAX('KPIKQI KHÁCH HÀNG'[Id]), FILTER( ALL('KPIKQI KHÁCH HÀNG'), 'KPIKQI KHÁCH HÀNG'[Ngày Báo cáo] = CurrentDate && 'KPIKQI KHÁCH HÀNG'[SP-DV] = CurrentSPDV && 'KPIKQI KHÁCH HÀNG'[Metric] = CurrentMetric ) ) -- Nếu nhiều dòng cùng Id, chọn UpdatedAt mới nhất VAR MaxUpdatedAt = CALCULATE( MAX('KPIKQI KHÁCH HÀNG'[UpdatedAt]), FILTER( ALL('KPIKQI KHÁCH HÀNG'), 'KPIKQI KHÁCH HÀNG'[Ngày Báo cáo] = CurrentDate && 'KPIKQI KHÁCH HÀNG'[SP-DV] = CurrentSPDV && 'KPIKQI KHÁCH HÀNG'[Metric] = CurrentMetric && 'KPIKQI KHÁCH HÀNG'[Id] = MaxID ) ) RETURN IF(CurrentID = MaxID && CurrentUpdate = MaxUpdatedAt, 1, 0)"
