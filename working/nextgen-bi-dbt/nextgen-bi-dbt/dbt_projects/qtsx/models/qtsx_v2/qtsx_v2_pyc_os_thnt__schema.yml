version: 2
models:
- name: qtsx_v2_pyc_os_thnt
  description: "Bảng qtsx_v2_pyc_os_thnt (nguồn Power BI: PYC OS THNT)."
  meta:
    label: "PYC OS THNT"
    powerbi_source: "PYC OS THNT"
    joins:
    - join: qtsx_v2_project
      sql_on: "${qtsx_v2_pyc_os_thnt.project_2} = ${qtsx_v2_project.project_name}"
      relationship: many-to-one
    metrics:
      pct_release_pyc:
        type: number
        sql: "SUM(CASE WHEN release_date IS NOT NULL THEN mm_pyc_thuc_te END) / NULLIF(SUM(mm_pyc_thuc_te), 0)"
        label: "% release PYC"
        format: percent
        round: 2
        description: "DAX: DIVIDE(SUM('PYC OS done release'[MM_PYC_Thực_tế_10823]), SUM('PYC OS THNT'[MM_PYC_Thực_tế_10823]), 0). KHÁC BẢN GỐC: thay vì cộng trên bảng con 'PYC OS done release', lọc ngay trên 'PYC OS THNT' theo điều kiện đã có ngày release. Hai cách trùng nhau khi 'PYC OS done release' đúng là tập PYC đã release của cùng nguồn."
      sum_mm_backlog:
        type: sum
        sql: mm_backlog
        label: "MM Tồn"
        description: "Sinh từ Power BI: sum(PYC OS THNT.MM Tồn)"
      sum_mm_pyc_thuc_te:
        type: sum
        sql: mm_pyc_thuc_te
        label: "MM đã nghiệm thu thành công"
        description: "Sinh từ Power BI: sum(PYC OS THNT.MM_PYC_Thực_tế_10823)"
      sum_mm_release25:
        type: sum
        sql: mm_release25
        label: "MM release25"
        description: "Sinh từ Power BI: sum(PYC OS THNT.MM release25)"
      sum_mm_release26:
        type: sum
        sql: mm_release26
        label: "MM release26"
        description: "Sinh từ Power BI: sum(PYC OS THNT.MM release26)"
