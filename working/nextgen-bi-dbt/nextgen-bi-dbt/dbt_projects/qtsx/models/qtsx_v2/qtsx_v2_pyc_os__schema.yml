version: 2
models:
- name: qtsx_v2_pyc_os
  description: "Bảng qtsx_v2_pyc_os (nguồn Power BI: PYC OS)."
  meta:
    label: "PYC OS"
    powerbi_source: "PYC OS"
    joins:
    - join: qtsx_v2_project
      sql_on: "${qtsx_v2_pyc_os.project_2} = ${qtsx_v2_project.project_name}"
      relationship: many-to-one
    metrics:
      average_so_ngay_create_ngay_ttsx_commit:
        type: average
        sql: so_ngay_create_ngay_ttsx_commit
        label: "Cycle time TTSX commit"
        description: "Sinh từ Power BI: average(PYC OS.So_ngay_create_ngay_TTSX_commit)"
      count_issue_key:
        type: count
        sql: issue_key
        label: "Số PYC"
        description: "Sinh từ Power BI: count(PYC OS.ISSUE_KEY)"
      count_pyc_released:
        type: count
        sql: "CASE WHEN issue_current_status_name = 'Released' THEN issue_key END"
        label: "Số PYC released"
        description: "DAX: CALCULATE( COUNT('PYC OS'[ISSUE_KEY]), 'PYC OS'[ISSUE_CURRENT_STATUS_NAME] = \"Released\" )"
      count_rows_filtered:
        type: count
        sql: "CASE WHEN evaluation = 'Pass' THEN 1 END"
        label: "Số dòng (có điều kiện)"
        description: "Metric phụ sinh từ DAX: COUNT(*) kèm điều kiện của CALCULATE | DAX measure: Số Pass"
      mm_released:
        type: sum
        sql: "CASE WHEN issue_current_status_name = 'Released' THEN mm_pyc_thuc_te END"
        label: "MM released"
        description: "DAX: CALCULATE( SUM('PYC OS'[MM_PYC_Thực_tế_10823]), 'PYC OS'[ISSUE_CURRENT_STATUS_NAME] = \"Released\" )"
      mm_thuc_te:
        type: sum
        sql: "CASE WHEN issue_current_status_name IN ('Bàn giao TT Sản phẩm', 'Released', 'ĐG TTK', 'Nghiệm thu thành công') THEN mm_pyc_thuc_te END"
        label: "MM_Thuc_Te"
        description: "DAX: CALCULATE( SUM('PYC OS'[MM_PYC_Thực_tế_10823]), 'PYC OS'[ISSUE_CURRENT_STATUS_NAME] in {\"Bàn giao TT Sản phẩm\", \"Released\",\"ĐG TTK\",\"Nghiệm thu thành công\"} )"
      mm_thuc_te_tinh_release:
        type: sum
        sql: "CASE WHEN issue_current_status_name IN ('Released', 'Bàn giao TT Sản phẩm', 'ĐG TTK') THEN mm_pyc_thuc_te END"
        label: "MM Thực tế tính release"
        description: "DAX: CALCULATE(SUM('PYC OS'[MM_PYC_Thực_tế_10823]), FILTER('PYC OS','PYC OS'[ISSUE_CURRENT_STATUS_NAME] in{\"Released\",\"Bàn giao TT Sản phẩm\",\"ĐG TTK\"}))"
      pct_hieu_su_dung_os:
        type: number
        sql: "SUM(CASE WHEN release_date IS NOT NULL THEN mm_pyc_thuc_te END) / NULLIF(SUM(mm_pyc_thuc_te), 0)"
        label: "Hiệu quả sử dụng OS"
        format: percent
        round: 0
        description: "DAX: DIVIDE(SUM('PYC OS done release'[MM_PYC_Thực_tế_10823]), [TT MM PYC], 0). Thay cho measure text 'Hiệu quả sử dụng OS' (\"n% / KPI > 50%\") — phần chữ dựng bằng Subtitle của Big value."
      pct_hieu_suat:
        type: number
        sql: "${sum_mm_pyc_thuc_te} / NULLIF(${sum_mm_ttsx_du_kien}, 0)"
        label: "% Hiệu suất"
        format: percent
        round: 0
        description: "DAX: DIVIDE(SUM('PYC OS'[MM_PYC_Thực_tế_10823]) , SUM('PYC OS'[MM_TTSX_Dự_kiến_10840]) ,0)"
      pct_on_time:
        type: number
        sql: "CAST(COUNT(CASE WHEN evaluation = 'Pass' THEN 1 END) AS DOUBLE) / NULLIF(COUNT(DISTINCT issue_key), 0)"
        label: "% Đúng hạn"
        format: percent
        round: 0
        description: "DAX: VAR TotalIssue = DISTINCTCOUNT('PYC OS'[ISSUE_KEY]) VAR PassCount = [Số Pass] + 0 RETURN IF(TotalIssue = 0, BLANK(), DIVIDE(PassCount, TotalIssue, 0)). Measure '% Pass Rate' và 'Pass Rate Display' cùng công thức — dùng chung metric này; phần chữ \"% / KPI > 95%\" và ▲/▼ dựng bằng Subtitle + Comparison của Big value."
      pct_pass_rate_display:
        type: number
        sql: "${count_rows_filtered} / NULLIF(${total_pyc}, 0)"
        label: "% Pass Rate Display"
        description: "DAX: VAR PassCount = CALCULATE(COUNTROWS('PYC OS'), 'PYC OS'[Đánh giá] = \"Pass\") VAR TotalCount = COUNTROWS('PYC OS') VAR PassRate = DIVIDE(PassCount, TotalCount, 0) RETURN PassRate"
      pct_release:
        type: number
        sql: "SUM(CASE WHEN release_date IS NOT NULL THEN mm_pyc_thuc_te END) / NULLIF(SUM(CASE WHEN issue_current_status_name IN ('Released', 'Bàn giao TT Sản phẩm', 'ĐG TTK')
                  THEN mm_pyc_thuc_te END), 0)"
        label: "% release"
        format: percent
        round: 2
        description: "DAX: VAR Tu = SUM('PYC OS done release'[MM_PYC_Thực_tế_10823]) VAR Mau = CALCULATE(SUM('PYC OS'[MM_PYC_Thực_tế_10823]), FILTER('PYC OS', [ISSUE_CURRENT_STATUS_NAME] IN {\"Released\",\"Bàn giao TT Sản phẩm\",\"ĐG TTK\"})). KHÁC BẢN GỐC: tử số lấy ngay trên 'PYC OS' với điều kiện đã có ngày release, thay vì cộng trên bảng con 'PYC OS done release'."
      rate_released_pyc:
        type: number
        sql: "${mm_released} / NULLIF(${sum_mm_pyc_thuc_te}, 0)"
        label: "Tỉ lệ released PYC"
        description: "DAX: DIVIDE([MM released], [TT MM PYC], 0)"
      so_pass:
        type: count
        sql: "CASE WHEN evaluation = 'Pass' THEN 1 END"
        label: "Số Pass"
        description: "DAX: CALCULATE(COUNTROWS('PYC OS'), 'PYC OS'[Đánh giá] = \"Pass\")"
      sum_mm_pyc_thuc_te:
        type: sum
        sql: mm_pyc_thuc_te
        label: "MM TTSX THỰC TẾ"
        description: "Sinh từ Power BI: sum(PYC OS.MM_PYC_Thực_tế_10823) | DAX measure: TT MM PYC"
      sum_mm_ttsx_du_kien:
        type: sum
        sql: mm_ttsx_du_kien
        label: "MM TTSX COMMIT"
        description: "Sinh từ Power BI: sum(PYC OS.MM_TTSX_Dự_kiến_10840)"
      sum_so_ngay_tu_nghiem_thu_den_release:
        type: sum
        sql: so_ngay_tu_nghiem_thu_den_release
        label: "Cycle time"
        description: "Sinh từ Power BI: sum(PYC OS.So_ngay_tu_Nghiem_thu_den_Release)"
      total_pyc:
        type: count
        sql: "*"
        label: "Total PYC"
        description: "DAX: COUNTROWS('PYC OS')"
