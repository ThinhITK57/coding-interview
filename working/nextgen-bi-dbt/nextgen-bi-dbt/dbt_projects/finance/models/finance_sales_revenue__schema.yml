version: 2

models:
  - name: finance_sales_revenue
    description: >
      Bảng chi tiết doanh thu bán hàng theo từng hóa đơn hoặc lần ghi nhận doanh thu.
      Bảng phục vụ phân tích doanh thu theo khách hàng, dịch vụ, ngành, vùng,
      đơn vị kinh doanh, Account Manager, Presale và các chiều kinh doanh khác.

    meta:
      label: "Doanh thu bán hàng"
      owner: "sonnv1"

      metrics:

        total_revenue_amount:
          type: sum
          sql: ${TABLE}.revenue_amount
          label: "Doanh thu gốc"
          category: "Doanh thu"
          description: >
            Tổng doanh thu gốc trước khi phân chia doanh thu.
          synonyms:
            - "Doanh thu bán hàng"
            - "Doanh thu gốc"
            - "Sales Revenue"

        total_revenue_share_amount:
          type: sum
          sql: ${TABLE}.revenue_share_amount
          label: "Doanh thu chia sẻ"
          category: "Doanh thu"
          description: >
            Tổng doanh thu được chia sẻ giữa các đơn vị.
          synonyms:
            - "Revenue Share"
            - "Doanh thu phân chia"

        total_final_revenue_amount:
          type: sum
          sql: ${TABLE}.final_revenue_amount
          label: "Doanh thu thực hiện"
          category: "Doanh thu"
          description: >
            Doanh thu cuối cùng được ghi nhận sau khi tính toán phân bổ.
          synonyms:
            - "Doanh thu thực hiện"
            - "Final Revenue"
            - "Doanh thu ghi nhận"

        total_vat_amount:
          type: sum
          sql: ${TABLE}.vat_amount
          label: "Thuế VAT"
          category: "Thuế"
          description: >
            Tổng thuế giá trị gia tăng của doanh thu.
          synonyms:
            - "VAT"
            - "Thuế GTGT"

        total_gross_amount:
          type: sum
          sql: ${TABLE}.gross_amount
          label: "Tổng giá trị hóa đơn"
          category: "Doanh thu"
          description: >
            Tổng giá trị hóa đơn bao gồm VAT.
          synonyms:
            - "Gross Amount"
            - "Tổng tiền hóa đơn"
            - "Doanh thu gồm VAT"

        total_invoice_count:
          type: count
          sql: "1.0"
          label: "Số hóa đơn"
          category: "Doanh thu"
          description: >
            Tổng số bản ghi hóa đơn/ghi nhận doanh thu.
          synonyms:
            - "Invoice Count"
            - "Số bản ghi doanh thu"

        avg_final_revenue_amount:
          type: average
          sql: ${TABLE}.final_revenue_amount
          label: "Doanh thu thực hiện trung bình"
          category: "Doanh thu"
          description: >
            Giá trị doanh thu thực hiện trung bình trên một bản ghi.
          synonyms:
            - "Average Final Revenue"
            - "Doanh thu ghi nhận trung bình"

        vat_to_final_revenue_ratio:
          type: number
          sql: ${total_vat_amount} / NULLIF(${total_final_revenue_amount}, 0.0)
          label: "Tỷ lệ VAT trên doanh thu thực hiện"
          category: "Thuế"
          format: "percent"
          description: >
            Tỷ lệ thuế VAT trên doanh thu thực hiện.
          synonyms:
            - "VAT Ratio"
            - "VAT / Final Revenue"

    columns:

      - name: invoice_date
        description: "Ngày ghi nhận doanh thu."
        meta:
          dimension:
            type: timestamp
            label: "Ngày hóa đơn"

      - name: invoice_type
        description: "Loại hóa đơn."
        meta:
          dimension:
            type: string
            label: "Loại hóa đơn"

      - name: revenue_amount
        description: "Doanh thu gốc."
        meta:
          dimension:
            type: number
            label: "Doanh thu gốc"

      - name: revenue_share_amount
        description: "Doanh thu chia sẻ."
        meta:
          dimension:
            type: number
            label: "Doanh thu chia sẻ"

      - name: final_revenue_amount
        description: "Doanh thu thực hiện sau phân bổ."
        meta:
          dimension:
            type: number
            label: "Doanh thu thực hiện"

      - name: vat_amount
        description: "Thuế giá trị gia tăng."
        meta:
          dimension:
            type: number
            label: "VAT"

      - name: gross_amount
        description: "Tổng giá trị hóa đơn bao gồm VAT."
        meta:
          dimension:
            type: number
            label: "Tổng giá trị hóa đơn"

      - name: revenue_source_name
