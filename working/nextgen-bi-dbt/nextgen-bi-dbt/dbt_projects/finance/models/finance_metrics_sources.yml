version: 2

sources:
- name: bi_silver__finance
  database: hive
  schema: "{{ env_var('DBT_TRINO_SCHEMA', 'bi_silver') }}"
  description: "Silver layer sources for domain: finance"

  tables:
  - name: finance_metrics
    description: >
      Bảng tổng hợp các chỉ số tài chính theo nhóm sản phẩm/dịch vụ, Trung tâm N-1 và ngày báo cáo.
      Bảng kết hợp doanh thu từ các nguồn actual, provisional, sales revenue và chi phí thực tế
      từ finance_actual_cost để tính các chỉ số như doanh thu, chi phí, lợi nhuận gộp và EBITDA
      ở cấp nhóm sản phẩm/dịch vụ.

      Đây không phải bảng tổng hợp tài chính toàn công ty. Chỉ nên sử dụng hoặc kết nối bảng này
      khi bài toán cần phân tích tài chính theo nhóm sản phẩm/dịch vụ thông qua product_category
      hoặc product_category_code. Nếu người dùng hỏi doanh thu, chi phí, lợi nhuận hoặc EBITDA
      của toàn công ty mà không đề cập tới nhóm sản phẩm/dịch vụ, nên ưu tiên sử dụng
      finance_revenue_cost_items hoặc finance_fact_ratios thay vì bảng này.

    columns:
      - name: report_date
        description: Ngày báo cáo của chỉ số tài chính theo nhóm sản phẩm/dịch vụ.

      - name: product_category
        description: >
          Tên nhóm sản phẩm/dịch vụ. Đây là chiều phân tích trọng tâm của bảng.
          Chỉ kết nối hoặc sử dụng bảng này khi câu hỏi có liên quan đến nhóm sản phẩm/dịch vụ,
          ví dụ doanh thu theo sản phẩm, chi phí theo dịch vụ hoặc EBITDA theo nhóm sản phẩm.

      - name: business_unit_level_1
        description: >
          Trung tâm N-1 hoặc đơn vị cấp 1 chịu trách nhiệm doanh thu hoặc chi phí
          của từng nhóm sản phẩm/dịch vụ.

      - name: total_revenue
        description: >
          Tổng doanh thu của từng nhóm sản phẩm/dịch vụ tại ngày báo cáo.
          Không phải doanh thu toàn công ty. Chỉ sử dụng khi phân tích theo
          product_category hoặc product_category_code.

      - name: total_cost
        description: >
          Tổng chi phí của từng nhóm sản phẩm/dịch vụ tại ngày báo cáo.
          Không phải tổng chi phí toàn công ty. Chỉ sử dụng khi phân tích theo
          product_category hoặc product_category_code.

      - name: gross_profit
        description: >
          Lợi nhuận gộp của từng nhóm sản phẩm/dịch vụ.
          Công thức: total_revenue - direct_labor_os_cost - production_infra_cost.
          Không phải lợi nhuận gộp toàn công ty.

      - name: ebitda
        description: >
          EBITDA của từng nhóm sản phẩm/dịch vụ.
          Công thức: total_revenue - total_cost + fixed_asset_depreciation_cost.
          Không phải EBITDA toàn công ty.

      - name: fixed_asset_depreciation_cost
        description: >
          Chi phí khấu hao tài sản cố định của từng nhóm sản phẩm/dịch vụ.
          Không phải chi phí khấu hao tài sản cố định toàn công ty.

      - name: direct_labor_os_cost
        description: >
          Chi phí nhân công và outsource trực tiếp của từng nhóm sản phẩm/dịch vụ.
          Không phải chi phí nhân công và outsource trực tiếp toàn công ty.

      - name: production_infra_cost
        description: >
          Chi phí hạ tầng, máy chủ, tài nguyên và công cụ dụng cụ phục vụ sản xuất
          của từng nhóm sản phẩm/dịch vụ. Không phải chi phí hạ tầng sản xuất toàn công ty.

      - name: business_os_cost
        description: >
          Chi phí outsource kinh doanh của từng nhóm sản phẩm/dịch vụ.
          Không phải chi phí outsource kinh doanh toàn công ty.