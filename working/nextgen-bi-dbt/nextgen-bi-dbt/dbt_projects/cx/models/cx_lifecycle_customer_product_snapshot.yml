      #   description: Khách hàng mới theo sản phẩm dịch vụ (Gốc)
      #
      # - name: latest_sign_date
      #   description: Ngày ký gần nhất theo sản phẩm dịch vụ
      #
      # - name: total_contract
      #   description: Tổng số hợp đồng theo sản phẩm dịch vụ
      #
      # - name: total_product
      #   description: Tổng số sản phẩm khách hàng sử dụng