version: 2
models:
- name: cx_cso_support_tickets
  description: >
      Lưu trữ vòng đời của một yêu cầu hỗ trợ (ticket) từ lúc tiếp nhận đến khi đóng,
      phục vụ phân tích hiệu suất vận hành (SLA) và trải nghiệm khách hàng (CX).

      Keywords: 'ticket; support ticket; customer support; helpdesk; incident; issue;
      request; SLA; overdue; violation; response time; resolution time; TTR; backlog;
      open ticket; closed ticket; resolved ticket; ticket status; priority; severity;
      urgency; agent; L1; L2; L3; L4; assigned; unassigned; customer group; segment;
      channel; email; chat; hotline; issue category; issue type; root cause; CSAT;
      satisfaction; sentiment; positive; negative; duplicate; reopened'
      
      Semantic:
      - Luôn sử dụng mặc định created_at trong các báo cáo theo thời gian, trừ trường hợp người dùng yêu cầu hoặc chỉ định cụ thể trong mô tả theo từng field/dimension

  meta:
    label: "CSO Support Tickets"
    owner: "lyttt3"
    metrics:
      ticket_count:
        type: count_distinct
        sql: ${TABLE}.ticket_id
        description: Tổng số ticket duy nhất, đếm theo ticket_id.
        label: "Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Ticket Count"
          - "Số lượng ticket"
      distinct_ticket_count:
        type: count_distinct
        sql: ${TABLE}.ticket_id
        description: 'VI: Số ticket duy nhất. | EN: Số ticket duy nhất.'
        label: "Distinct Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Distinct Ticket Count"
          - "Số lượng ticket duy nhất"
      avg_agent_reply_count:
        type: average
        sql: ${TABLE}.agent_reply_count
        description: Số lượng phản hồi/trao đổi trung bình do nhân viên (agent) thực hiện trên mỗi ticket. Phản ánh mức độ tương tác cần thiết để xử lý vấn đề.
        label: "Avg Agent Reply Count"
        category: "Support Operations"
        synonyms:
          - "Avg Agent Reply Count"
          - "Trung bình số lượng phản hồi của agent"
      overdue_ticket_count:
        type: sum
        sql: CASE WHEN is_overdue THEN 1.0 ELSE 0.0 END
        description: Số ticket quá hạn SLA.
        label: "Overdue Ticket Count"
        category: "Service Quality"
        synonyms:
          - "Overdue Ticket Count"
          - "Số lượng ticket quá hạn"
      avg_first_response_minutes:
        type: average
        sql: ${TABLE}.first_response_time_minutes
        description: 'VI: Thời gian phản hồi đầu tiên trung bình (phút). | EN: Thời gian phản hồi đầu tiên trung bình (phút).'
        label: "Avg First Response Minutes"
        category: "Support Operations"
        synonyms:
          - "Avg First Response Minutes"
          - "Trung bình đầu tiên phản hồi phút"
      avg_resolution_time_minutes:
        type: average
        sql: ${TABLE}.resolution_time_minutes
        description: 'VI: Thời gian xử lý trung bình (phút). | EN: Thời gian xử lý trung bình (phút).'
        label: "Avg Resolution Time Minutes"
        category: "Operational KPI"
        synonyms:
          - "Avg Resolution Time Minutes"
          - "Trung bình thời gian xử lý (phút)"
      sla_breach_count:
        type: sum
        sql: CASE WHEN COALESCE(${TABLE}.l1_violated, false) OR COALESCE(${TABLE}.l2_violated, false) OR COALESCE(${TABLE}.l3_violated, false) OR COALESCE(${TABLE}.l4_violated, false) THEN 1.0 ELSE 0.0 END
        description: 'VI: Số ticket vi phạm bất kỳ cấp SLA nào. | EN: Số ticket vi phạm bất kỳ cấp SLA nào.'
        label: "SLA Breach Count"
        category: "Service Quality"
        synonyms:
          - "SLA Breach Count"
          - "Số lượng vi phạm SLA"
      sla_breach_rate:
        type: number
        sql: ${sla_breach_count} / NULLIF(${ticket_count}, 0.0)
        description: 'VI: Tỷ lệ ticket vi phạm SLA. | EN: Tỷ lệ ticket vi phạm SLA.'
        label: "SLA Breach Rate"
        category: "Service Quality"
        synonyms:
          - "SLA Breach Rate"
          - "Tỷ lệ vi phạm SLA"
      duplicated_ticket_count:
        type: sum
        sql: CASE WHEN is_duplicated_ticket THEN 1.0 ELSE 0.0 END
        description: Số ticket bị trùng lặp.
        label: "Duplicated Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Duplicated Ticket Count"
          - "Số lượng ticket trùng lặp"
      reopened_ticket_count:
        type: sum
        sql: CASE WHEN is_reopened_by_cx THEN 1.0 ELSE 0.0 END
        description: Số ticket bị khách hàng mở lại.
        label: "Reopened Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Reopened Ticket Count"
          - "Số lượng ticket mở lại"
      sla_violated_ticket_count:
        type: sum
        sql: CASE WHEN violated_level > 0.0 THEN 1.0 ELSE 0.0 END
        description: Số ticket có vi phạm SLA.
        label: "SLA Violated Ticket Count"
        category: "Service Quality"
        synonyms:
          - "SLA Violated Ticket Count"
          - "Số lượng vi phạm SLA ticket"
      non_violated_ticket_count:
        type: sum
        sql: CASE WHEN violated_level = 0.0 THEN 1.0 ELSE 0.0 END
        description: Số ticket không vi phạm SLA.
        label: "Non Violated Ticket Count"
        category: "Service Quality"
        synonyms:
          - "Non Violated Ticket Count"
          - "Số lượng không vi phạm ticket"
      responded_ticket_count:
        type: sum
        sql: CASE WHEN first_responded_at IS NOT NULL THEN 1.0 ELSE 0.0 END
        description: Số ticket đã có phản hồi đầu tiên.
        label: "Responded Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Responded Ticket Count"
          - "Số lượng Responded ticket"
      resolved_ticket_count:
        type: sum
        sql: CASE WHEN resolved_at IS NOT NULL THEN 1.0 ELSE 0.0 END
        description: Số ticket đã được resolve.
        label: "Resolved Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Resolved Ticket Count"
          - "Số lượng đã xử lý ticket"
      closed_ticket_count:
        type: count_distinct
        sql: CASE WHEN UPPER(status_name) ='CLOSED' THEN ticket_id END
        description: Số ticket đã đóng.
        label: "Closed Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Closed Ticket Count"
          - "Số lượng đã đóng ticket"
      open_ticket_count:
        type: count_distinct
        sql: CASE WHEN UPPER(status_name) <> 'CLOSED' THEN ticket_id END
        description: Số ticket còn đang mở hoặc đang xử lý. Dùng cho backlog.
        label: "Open Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Open Ticket Count"
          - "Số lượng đang mở ticket"
      unassigned_ticket_count:
        type: sum
        sql: CASE WHEN UPPER(assigned_agent_stage) = 'UNASSIGNED' THEN 1.0 ELSE 0.0 END
        description: Số ticket chưa được gán agent xử lý.
        label: "Unassigned Ticket Count"
        category: "Support Operations"
        synonyms:
          - "Unassigned Ticket Count"
          - "Số lượng chưa phân công ticket"
      negative_sentiment_ticket_count:
        type: sum
        sql: CASE WHEN LOWER(sentiment) = 'negative' or LOWER(sentiment) = 'very negative' THEN 1.0 ELSE 0.0 END
        description: Số ticket có sentiment tiêu cực.
        label: "Negative Sentiment Ticket Count"
        category: "Customer Experience"
        synonyms:
          - "Negative Sentiment Ticket Count"
          - "Số lượng tiêu cực cảm xúc ticket"
      positive_sentiment_ticket_count:
        type: sum
        sql: CASE WHEN LOWER(sentiment) = 'positive' THEN 1.0 ELSE 0.0 END
        description: Số ticket có sentiment tích cực.
        label: "Positive Sentiment Ticket Count"
        category: "Customer Experience"
        synonyms:
          - "Positive Sentiment Ticket Count"
          - "Số lượng tích cực cảm xúc ticket"
      normal_sentiment_ticket_count:
        type: sum
        sql: CASE WHEN LOWER(sentiment) = 'neutral' THEN 1.0 ELSE 0.0 END
        description: Số ticket có sentiment bình thường.
        label: "Normal Sentiment Ticket Count"
        category: "Customer Experience"
        synonyms:
          - "Normal Sentiment Ticket Count"
          - "Số lượng trung tính cảm xúc ticket"
      positive_sentiment_rate:
        type: number
        sql: 1.0 * ${positive_sentiment_ticket_count} / NULLIF(${ticket_count}, 0.0)
        description: Tỷ lệ ticket có sentiment tích cực trên tổng số ticket.
        label: "Positive Sentiment Rate"
        category: "Customer Experience"
        synonyms:
          - "Positive Sentiment Rate"
          - "Tỷ lệ tích cực cảm xúc"
      negative_sentiment_rate:
        type: number
        sql: 1.0 * ${negative_sentiment_ticket_count} / NULLIF(${ticket_count}, 0.0)
        description: Tỷ lệ ticket có sentiment tiêu cực trên tổng số ticket.
        label: "Negative Sentiment Rate"
        category: "Customer Experience"
        synonyms:
          - "Negative Sentiment Rate"
          - "Tỷ lệ tiêu cực cảm xúc"
      normal_sentiment_rate:
        type: number
        sql: 1.0 * ${normal_sentiment_ticket_count} / NULLIF(${ticket_count}, 0.0)
        description: Tỷ lệ ticket có sentiment bình thường trên tổng số ticket.
        label: "Normal Sentiment Rate"
        category: "Customer Experience"
        synonyms:
          - "Normal Sentiment Rate"
          - "Tỷ lệ trung tính cảm xúc"
      avg_response_time_minutes:
        type: average
        sql: ${TABLE}.response_time_minutes
        description: Thời gian phản hồi trung bình tính theo phút.
        label: "Avg Response Time Minutes"
        category: "Support Operations"
        synonyms:
          - "Avg Response Time Minutes"
          - "Trung bình thời gian phản hồi (phút)"
      avg_time_to_response_minutes:
        type: average
        sql: ${TABLE}.time_to_response_minutes
        description: Thời gian trung bình tới phản hồi đầu tiên.
        label: "Avg Time To Response Minutes"
        category: "Support Operations"
        synonyms:
          - "Avg Time To Response Minutes"
          - "Trung bình thời gian phản hồi phút"
      avg_l1_time_actual_minutes:
        type: average
        sql: ${TABLE}.l1_time_actual_minutes
        description: Thời gian xử lý trung bình của tuyến L1.
        label: "Avg L1 Time Actual Minutes"
        category: "Operational KPI"
        synonyms:
          - "Avg L1 Time Actual Minutes"
          - "Trung bình L1 thời gian thực tế phút"
      avg_l2_time_actual_minutes:
        type: average
        sql: ${TABLE}.l2_time_actual_minutes
        description: Thời gian xử lý trung bình của tuyến L2.
        label: "Avg L2 Time Actual Minutes"
        category: "Operational KPI"
        synonyms:
          - "Avg L2 Time Actual Minutes"
          - "Trung bình L2 thời gian thực tế phút"
      avg_l3_time_actual_minutes:
        type: average
        sql: ${TABLE}.l3_time_actual_minutes
        description: Thời gian xử lý trung bình của tuyến L3.
        label: "Avg L3 Time Actual Minutes"
        category: "Operational KPI"
        synonyms:
          - "Avg L3 Time Actual Minutes"
          - "Trung bình L3 thời gian thực tế phút"
      avg_l4_time_actual_minutes:
        type: average
        sql: ${TABLE}.l4_time_actual_minutes
        description: Thời gian xử lý trung bình của tuyến L4.
        label: "Avg L4 Time Actual Minutes"
        category: "Operational KPI"
        synonyms:
          - "Avg L4 Time Actual Minutes"
          - "Trung bình L4 thời gian thực tế phút"
      avg_due_date_changes:
        type: average
        sql: ${TABLE}.number_of_due_date_changes
        description: Số lần thay đổi due date trung bình trên mỗi ticket.
        label: "Avg Due Date Changes"
        category: "Support Operations"
        synonyms:
          - "Avg Due Date Changes"
          - "Trung bình đến hạn ngày Changes"
      total_due_date_changes:
        type: sum
        sql: ${TABLE}.number_of_due_date_changes
        description: Tổng số lần thay đổi due date.
        label: "Total Due Date Changes"
        category: "Operational KPI"
        synonyms:
          - "Total Due Date Changes"
          - "Tổng đến hạn ngày Changes"
      avg_customer_satisfaction_rating:
        type: average
        sql: ${TABLE}.customer_satisfaction_rating
        description: Điểm hài lòng khách hàng trung bình.
        label: "Avg Customer Satisfaction Rating"
        category: "Customer Analytics"
        synonyms:
          - "Avg Customer Satisfaction Rating"
          - "Trung bình khách hàng Satisfaction Rating"
      avg_violated_level:
        type: average
        sql: ${TABLE}.violated_level
        description: Mức vi phạm SLA trung bình.
        label: "Avg Violated Level"
        category: "Operational KPI"
        synonyms:
          - "Avg Violated Level"
          - "Trung bình vi phạm cấp độ"
      overdue_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN is_overdue THEN ticket_id END)\n  / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket quá hạn trên tổng số ticket.
        label: "Overdue Rate"
        category: "Service Quality"
        synonyms:
          - "Overdue Rate"
          - "Tỷ lệ quá hạn"
      reopen_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN is_reopened_by_cx THEN ticket_id END)\n   / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket được ReOpen/mở lại/kích hoạt lại từ CX.
        label: "Reopen Rate"
        category: "Support Operations"
        synonyms:
          - "Reopen Rate"
          - "Tỷ lệ mở lại"
      duplicated_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN is_duplicated_ticket THEN ticket_id END)\n   / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket trùng lặp.
        label: "Duplicated Rate"
        category: "Support Operations"
        synonyms:
          - "Duplicated Rate"
          - "Tỷ lệ trùng lặp"
      sla_violation_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN violated_level > 0.0 THEN ticket_id END)\n    / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket có vi phạm SLA.
        label: "SLA Violation Rate"
        category: "Service Quality"
        synonyms:
          - "SLA Violation Rate"
          - "Tỷ lệ vi phạm SLA"
      sla_compliance_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN violated_level = 0.0 THEN ticket_id END)\n    / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket không vi phạm SLA.
        label: "SLA Compliance Rate"
        category: "Service Quality"
        synonyms:
          - "SLA Compliance Rate"
          - "Tỷ lệ SLA tuân thủ"
      response_coverage_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN first_responded_at IS NOT NULL THEN ticket_id END)\n   / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket đã có phản hồi đầu tiên.
        label: "Response Coverage Rate"
        category: "Support Operations"
        synonyms:
          - "Response Coverage Rate"
          - "Tỷ lệ phản hồi bao phủ"
      resolution_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN resolved_at IS NOT NULL THEN ticket_id END)\n    / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket đã resolve.
        label: "Resolution Rate"
        category: "Support Operations"
        synonyms:
          - "Resolution Rate"
          - "Tỷ lệ xử lý"
      closure_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(DISTINCT ticket_id) = 0.0 THEN 0.0\n  ELSE 1.0 * COUNT(DISTINCT CASE WHEN closed_at IS NOT NULL THEN ticket_id END)\n    / COUNT(DISTINCT ticket_id)\nEND"
        description: Tỷ lệ ticket đã đóng.
        label: "Closure Rate"
        category: "Support Operations"
        synonyms:
          - "Closure Rate"
          - "Tỷ lệ đóng"
      csat_coverage_rate:
        type: number
        sql: "CASE\n  WHEN COUNT(*) = 0.0 THEN 0.0\n  ELSE 1.0 * SUM(CASE WHEN customer_satisfaction_rating IS NOT NULL THEN 1.0 ELSE 0.0 END) / COUNT(*)\nEND"
        description: Tỷ lệ ticket có phản hồi điểm hài lòng.
        label: "CSAT Coverage Rate"
        category: "Customer Experience"
        synonyms:
          - "CSAT Coverage Rate"
          - "Tỷ lệ CSAT bao phủ"
      avg_resolve_time_minutes:
        type: average
        sql: date_diff('minute', ${TABLE}.created_at, ${TABLE}.resolved_at)
        description: Average time to resolve tickets in minutes. Calculated from created_at to resolved_at.
        label: "Avg Resolve Time Minutes"
        category: "Support Operations"
        synonyms:
          - "Avg Resolve Time Minutes"
          - "Trung bình thời gian xử lý (phút)"
      min_resolve_time_minutes:
        type: min
        sql: date_diff('minute', ${TABLE}.created_at, ${TABLE}.resolved_at)
        description: Fastest resolution time observed among tickets, in minutes.
        label: "Min Resolve Time Minutes"
        category: "Support Operations"
        synonyms:
          - "Min Resolve Time Minutes"
          - "Thời gian xử lý nhỏ nhất (phút)"
      max_resolve_time_minutes:
        type: max
        sql: date_diff('minute', ${TABLE}.created_at, ${TABLE}.resolved_at)
        description: Longest resolution time observed among tickets, in minutes.
        label: "Max Resolve Time Minutes"
        category: "Support Operations"
        synonyms:
          - "Max Resolve Time Minutes"
          - "Thời gian xử lý lớn nhất (phút)"
      total_resolve_time_minutes:
        type: sum
        sql: date_diff('minute', ${TABLE}.created_at, ${TABLE}.resolved_at)
        description: Total accumulated resolution time across all tickets, in minutes.
        label: "Total Resolve Time Minutes"
        category: "Support Operations"
        synonyms:
          - "Total Resolve Time Minutes"
          - "Tổng thời gian xử lý (phút)"
      min_agent_reply_count:
        type: min
        sql: ${TABLE}.agent_reply_count
        description: Số lượng phản hồi/trao đổi thấp nhất của agent ghi nhận trên một ticket.
        label: "Min Agent Reply Count"
        category: "Support Operations"
        synonyms:
          - "Min Agent Reply Count"
          - "Giá trị nhỏ nhất của số lượng phản hồi của agent"
      max_agent_reply_count:
        type: max
        sql: ${TABLE}.agent_reply_count
        description: Số lượng phản hồi/trao đổi cao nhất của agent ghi nhận trên một ticket.
        label: "Max Agent Reply Count"
        category: "Support Operations"
        synonyms:
          - "Max Agent Reply Count"
          - "Giá trị lớn nhất của số lượng phản hồi của agent"
      total_agent_reply_count:
        type: sum
        sql: ${TABLE}.agent_reply_count
        description: Tổng số phản hồi/trao đổi của agent trên toàn bộ các ticket. Dùng để đo lường tổng khối lượng công việc hỗ trợ.
        label: "Total Agent Reply Count"
        category: "Support Operations"
        synonyms:
          - "Total Agent Reply Count"
          - "Tổng số lượng phản hồi của agent"
  columns:
  - name: ticket_id
    description: Mã định danh duy nhất của phiếu hỗ trợ khách hàng.
    meta:
      dimension:
        type: string
        label: Mã ticket
    tests:
    - not_null
    - unique
  - name: subject
    description: Tiêu đề mô tả ngắn gọn vấn đề hoặc yêu cầu của ticket.
    meta:
      dimension:
        type: string
        label: tiêu đề ticket
  - name: customer_group
    description: 'Phân hạng khách hàng theo cấp độ: VVIP, VIP, Growth, Standard'
    meta:
      dimension:
        type: string
        label: loại khách hàng
  - name: status_name
    description: Trạng thái hiện tại của phiếu hỗ trợ khách hàng.
    meta:
      dimension:
        type: string
        label: trạng thái ticket
  - name: priority_level
    description: Mức độ ưu tiên của ticket hỗ trợ, thể hiện mức quan trọng cần xử lý.
    meta:
      dimension:
        type: string
        label: cấp độ ưu tiên
  - name: created_at
    description: Thời điểm mà ticket được tạo trong hệ thống. 
    meta:
      dimension:
        type: timestamp
        label: ngày tạo
        synonyms:
          - Ngày báo cáo
          - Ngày ghi nhận

  - name: updated_at
    description: Thời gian cập nhật cuối cùng của ticket trong hệ thống.
    meta:
      dimension:
        type: timestamp
        label: thời gian cập nhật
  - name: first_responded_at
    description: Thời gian phản hồi đầu tiên của ticket từ nhân viên hỗ trợ.
    meta:
      dimension:
        type: timestamp
        label: thời gian phản hồi đầu tiên
  - name: fr_due_by
    description: Hạn chót (deadline) mà nhân viên phải gửi phản hồi đầu tiên cho khách hàng để không vi phạm SLA phản hồi (SLA / RT).
    meta:
      dimension:
        type: timestamp
        label: Hạn chót phản hồi lần đầu
  - name: due_by
    description: Hạn chót (deadline) để xử lý dứt điểm và đóng ticket để không vi phạm SLA giải quyết (SLA / TTR).
    meta:
      dimension:
        type: timestamp
