version: 2
sources:
- name: bi_silver__cx
  database: hive
  schema: "{{ env_var('DBT_TRINO_SCHEMA', 'bi_silver') }}"
  description: 'Silver layer sources for domain: cx'
  tables:
  - name: cx_sur_question_response
    description: Bảng này lưu trữ các câu trả lời chi tiết của khách hàng trong các khảo sát, bao gồm nội dung trả lời, điểm số, thẻ, và thông tin liên quan đến hành trình, nhóm KPI và danh mục sản phẩm. Dữ liệu được sử dụng để phân tích mức độ hài lòng, đánh giá hiệu suất sản phẩm và hỗ trợ báo cáo KPI theo các phân khúc và điểm chạm khách hàng.
    columns:
    - name: collected_date
      description: Ngày ghi nhận dữ liệu trả lời khảo sát.
    - name: survey_id
      description: Mã định danh của khảo sát mà câu trả lời thuộc về.
      tests:
      - not_null
    - name: response_id
      description: Mã định danh duy nhất cho mỗi phản hồi trong khảo sát.
    - name: cso_ticket_id
      description: "Mã định danh duy nhất của ticket, nếu data ở dạng số có 5 ký tự (eg: 54123), thì có nghĩa survey này được tạo ra để khảo sát với ticket đã đóng."
    - name: respondent_uuid
      description: Mã định danh duy nhất của người trả lời khảo sát.
    - name: question_id
      description: Mã định danh duy nhất của câu hỏi trong khảo sát.
    - name: question_type
      description: Loại câu hỏi được sử dụng trong khảo sát, mô tả dạng hoặc nhóm câu hỏi.
    - name: choice_id
      description: Mã định danh của lựa chọn trả lời được khách hàng chọn trong khảo sát.
    - name: answer_string
      description: Nội dung câu trả lời dạng văn bản mà khách hàng cung cấp trong khảo sát.
    - name: answer_tag
      description: Nhãn mô tả loại hoặc nhóm câu trả lời trong khảo sát khách hàng.
    - name: comment
      description: Bình luận hoặc nhận xét tự do của khách hàng trong khảo sát.
    - name: choice_content
      description: Nội dung văn bản của lựa chọn mà khách hàng đã chọn trong câu hỏi khảo sát.
    - name: item_content
      description: Nội dung văn bản của mục câu hỏi trong khảo sát khách hàng.
    - name: answer_number
      description: Số thứ tự của câu trả lời trong mỗi bản khảo sát.
    - name: item_score_value
      description: Điểm số dạng số, nếu có; =0 nếu chỉ là đánh giá text
    - name: item_score_label
      description: Đánh giá dạng text, ví dụ Good/Bad/Medium
    - name: question_clean
      description: Column question_clean in cx_sur_question_response
    - name: kpi_type
      description: Loại Chỉ số đo lường
    - name: journey
      description: Giai đoạn trải nghiệm
    - name: customer_touchpoint
      description: Điểm tiếp xúc của khách hàng trong hành trình tương tác.
    - name: product_category
      description: Danh mục sản phẩm dịch vụ trong khảo sát.
    - name: kpi_group
      description: Nhóm KPI mà câu trả lời thuộc về, dùng để phân loại các chỉ tiêu hiệu suất.
    - name: customer_nps_score
      description: Điểm số dạng số thuộc kpt là nps, vÌ survey có thể làm nhiều lần nó là câu trả lời có điểm cao nhất của khách hàng cho câu hỏi
    - name: customer_csat_score
      description: Điểm số dạng số thuộc kpt là csat, vÌ survey có thể làm nhiều lần nó là câu trả lời có điểm cao nhất của khách hàng cho câu hỏi
    - name: customer_ces_score
      description: Điểm số dạng số thuộc kpt là ces, vÌ survey có thể làm nhiều lần nó là câu trả lời có điểm cao nhất của khách hàng cho câu hỏi