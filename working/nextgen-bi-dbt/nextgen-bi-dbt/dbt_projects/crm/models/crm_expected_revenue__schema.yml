version: 2

models:
  - name: crm_expected_revenue
    description: >
      [CRM] Doanh thu dự kiến/pipeline value cho các cơ hội chưa ký hợp đồng (doanh thu dự ước chưa ký hợp đồng),
      đã phân bổ theo kỳ thanh toán đến từng SPDV. Bảng cung cấp doanh thu dự kiến, pipeline value.
      Semantic: 
        - Hỏi 'doanh thu', với thời gian trong tương lai sẽ là doanh thu dự kiến, pipeline value và bóc tách theo cơ cấu. Tương tự khi hỏi N tháng đầu năm, hay N tháng cuối năm cũng cần đánh giá là tương lai hay quá khứ
        - Bảng chứa danh sách dự án lên doanh thu chưa ký hợp đồng (dùng deal_name, contract_number), danh sách dự án dự kiến lên doanh thu.
        - revenue_segment_l1:  Dù người dùng có hỏi "KH" hay không, thì khi hỏi doanh thu , phân bổ doanh thu , kế hoạch doanh thu , tỷ lệ hoàn thành, mà có hỏi đến "phân khúc/cắt lớp" , thì cần sử dụng  revenue_segment_l1. Trừ khi người dùng chỉ định rõ sang cắt lớp khác
        - Bảng này không cung cấp doanh số
        - Khi hỏi đến doanh thu theo trung tâm/đơn vị kinh doanh, sử dụng bảng crm_product_service_group_mapping để lọc lấy product_category rồi filter tiếp bảng này
        - doanh thu ước chưa ký hợp đồng, doanh thu ước cơ hội: là Doanh thu pipeline value theo kỳ ước (các tháng tương lai, tính cả tháng hiện tại)
        - Khi hỏi doanh thu nhóm SDPV (có thể cắt lớp theo thời gian), không chỉ rõ nhóm nào thì mặc định nhóm tập đoàn product_service_group. Nếu tên nhóm có trong product_service_group thì ưu tiên, trừ trường hợp người dùng chỉ định rõ nhóm theo VCS
        - Khi có yêu cầu cắt lớp theo thời gian, nếu người dùng không chỉ định rõ thì ưu tiên mặc định ngày ghi nhận doanh thu payment_date, trừ trường hợp người dùng chỉ định rõ trường thời gian khác
        
    meta:
      label: CRM Expected Revenue
      owner: huongnv1
      joins:
        - join: crm_deals
          sql_on: ${crm_expected_revenue.deal_id} = ${crm_deals.deal_id}
          relationship: many-to-one
      metrics:
        product_revenue_amount:
          type: sum
          sql: vnd_amount
          label: Giá trị Pipeline
          description: Tổng giá trị doanh thu của toàn bộ Opportunity.
          synonyms:
            - pipeline value
            - gross pipeline
            - opportunity value

        pipeline_revenue_amount:
          type: sum
          sql: vnd_amount
          label: Doanh thu Pipeline
          description: Doanh thu Pipeline theo giá trị kỳ vọng (Expected Revenue chưa ký hợp đồng).
          synonyms:
            - expected revenue  chưa ký hợp đồng
            - weighted pipeline
            - pipeline revenue

        carryover_renew_expected_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Renew' AND is_in_year = false THEN vnd_amount  ELSE 0.0 END"
          label: Doanh thu Renew vắt năm
          description: Doanh thu Pipeline của các hợp đồng Renew từ các năm trước.

        in_year_renew_expected_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Renew' AND is_in_year = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Renew trong năm
          description: Doanh thu Pipeline của các hợp đồng Renew phát sinh trong năm hiện tại.

        expected_non_si_revenue_amount:
          type: sum
          sql: "CASE WHEN product_category <> 'SI' THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu ngoài SI
          description: Doanh thu Pipeline của các sản phẩm không thuộc nhóm SI.

        expected_si_revenue_amount:
          type: sum
          sql: "CASE WHEN product_category = 'SI' THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu SI
          description: Doanh thu Pipeline của các sản phẩm thuộc nhóm SI.

        expected_arr_amount:
          type: sum
          sql: "CASE WHEN is_recurring = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu ARR
          description: Doanh thu Pipeline của các sản phẩm ARR (Recurring Revenue).

        expected_non_arr_amount:
          type: sum
          sql: "CASE WHEN is_recurring != true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Non-ARR
          description: Doanh thu Pipeline của các sản phẩm không thuộc ARR, bao gồm cả giá trị NULL.

