version: 2

models:
  - name: crm_business_unit_revenue_kpi_plan
    description: >
      Kế hoạch KPI doanh thu theo Sản phẩm dịch vụ (SPDV) và Trung tâm,
      bao gồm ba mức mục tiêu Must, Should và Nice. Dữ liệu được phân bổ
      theo loại doanh thu, quý và tổng kế hoạch năm.
      Semantic: Khi người dùng hỏi kế hoạch và KPI mà không nói rõ cụ thể Must/Should/Nice, thì cần cung cấp cả 3 giá trị kế hoạch đó.
      Semantic: Nếu người dùng hỏi 'kế hoạch doanh thu' không chỉ rõ mức tập đoàn hay mức trung tâm MSN, thì cứ lấy mặc định theo mức tập đoàn. Các giá trị khác cũng áp dụng tương tự
      Semantic: Khi đề cập số liệu 'kế hoạch doanh thu' liên quan đến nhiệm vụ kế hoạch của trung tâm/phòng ban

    meta:
      label: "Kế hoạch KPI doanh thu SPDV theo Trung tâm"
      synonyms:
        - "kế hoạch doanh thu"
        - "KPI doanh thu"
        - "kế hoạch KPI doanh thu"
        - "doanh thu kế hoạch"
        - "kế hoạch doanh thu SPDV"
        - "KPI doanh thu SPDV"
        - "kế hoạch doanh thu theo trung tâm"
        - "kế hoạch doanh thu theo SPDV"

    columns:

      # ============================================================
      # SPDV
      # ============================================================

      - name: product_category
        description: "Tên nhóm Sản phẩm dịch vụ (SPDV)."
        meta:
          dimension:
            type: string
            label: "Nhóm SPDV"
            synonyms:
              - "sản phẩm dịch vụ"
              - "SPDV"
              - "nhóm sản phẩm"
              - "product category"

      - name: product_category_code
        description: "Mã nhóm Sản phẩm dịch vụ."
        meta:
          dimension:
            type: string
            label: "Mã nhóm SPDV"
            synonyms:
              - "mã SPDV"
              - "mã sản phẩm dịch vụ"
              - "SPDV code"

      - name: product_category_group
        description: "Nhóm phân loại của Sản phẩm dịch vụ."
        meta:
          dimension:
            type: string
            label: "Phân nhóm SPDV"
            synonyms:
              - "nhóm SPDV"
              - "phân nhóm sản phẩm"
              - "product group"

      # ============================================================
      # BUSINESS UNIT / TRUNG TÂM
      # ============================================================

      - name: business_unit_n1
        description: "Tên Viết tắt Trung tâm/đơn vị kinh doanh cấp N1 phụ trách SPDV."
        meta:
          dimension:
            type: string
            label: "Tên Trung tâm Viết tắt"
            synonyms:
              - "Tên trung tâm"
              - "trung tâm"
              - "đơn vị"
              - "đơn vị kinh doanh"
              - "business unit"
              - "Tên phòng ban"
              - TT PT&CSNC
              - TT SP Enterprise
              - TT SP Telco
              - TT SX&CNTT
              - TTGS
              - TT DV ATTT
              - TT KDMN
              - SI

      - name: business_unit_n1_full_name
        description: "Tên đầy đủ của Trung tâm/đơn vị kinh doanh cấp N1."
        meta:
          dimension:
            type: string
            label: "Tên Trung tâm"
            synonyms:
              - "tên trung tâm"
              - "trung tâm"
              - "đơn vị"
              - "đơn vị kinh doanh"
              - "business unit name"
              - "Tên phòng ban đầy đủ"

      # ============================================================
