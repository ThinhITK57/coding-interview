version: 2

models:
  - name: crm_committed_revenue
    description: >
      [CRM] Doanh thu đã ký hợp đồng (Won/Signed), được phân bổ theo kỳ thanh toán,
      bóc tách đến từng SPDV và các chiều quản trị. Bảng dữ liệu cung cấp doanh thu chắc chắn, doanh thu gia hạn, doanh thu bán thêm, doanh thu dự báo chắc chắn, hoặc doanh thu đã ký hợp đồng ở các tháng tương lai gọi là dự ước
      Semantic: 
        - Hỏi 'doanh thu', với thời gian trong tương lai sẽ là doanh thu chắc chắn, doanh thu gia hạn, doanh thu bán thêm, doanh thu dự báo chắc chắn và bóc tách theo cơ cấu. Tương tự khi hỏi N tháng đầu năm, hay N tháng cuối năm cũng cần đánh giá là tương lai hay quá khứ
        - Bảng chứa danh sách dự án lên doanh thu đã ký (deal_name, contract_number), danh sách dự án đã ký hợp đồng dự kiến trong tương lai sẽ lên doanh thu.
        - revenue_segment_l1:  Dù người dùng có hỏi "KH" hay không, thì khi hỏi doanh thu , phân bổ doanh thu , kế hoạch doanh thu , tỷ lệ hoàn thành, mà có hỏi đến "phân khúc/cắt lớp" , thì cần sử dụng  revenue_segment_l1. Trừ khi người dùng chỉ định rõ sang cắt lớp khác
        - Bảng này không cung cấp doanh số
        - Khi hỏi đến doanh thu theo trung tâm/đơn vị kinh doanh, nếu business_unit_level_1 không có dữ liệu thì sử dụng bảng crm_product_service_group_mapping để lọc lấy product_category rồi filter tiếp bảng này
        - doanh thu ước đã ký hợp đồng: là Doanh thu chắc chắn theo kỳ ước (các tháng tương lai, tính cả tháng hiện tại)
        - Khi hỏi doanh thu nhóm SDPV (có thể cắt lớp theo thời gian), không chỉ rõ nhóm nào thì mặc định nhóm tập đoàn product_service_group
        - Khi có yêu cầu cắt lớp theo thời gian, nếu người dùng không chỉ định rõ thì ưu tiên mặc định ngày ghi nhận doanh thu payment_date, trừ trường hợp người dùng chỉ định rõ trường thời gian khác. Người dùng có hỏi "Hợp đồng New (Ký mới)" vẫn là payment_date
        
    meta:
      label: CRM Committed Revenue
      owner: huongnv1
      joins:
        - join: crm_deals
          sql_on: ${crm_committed_revenue.deal_id} = ${crm_deals.deal_id}
          relationship: many-to-one
      metrics:
        contracted_revenue_amount:
          type: sum
          sql: vnd_amount
          label: Doanh thu hợp đồng
          description: Tổng giá trị doanh thu của tất cả sản phẩm thuộc các hợp đồng đã ký, bao gồm Actual và Provisional.
          synonyms: ["contracted revenue", "contract value", "DTHĐ"]

        signed_contract_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu đã ký hợp đồng
          description: Doanh thu Actual từ các hợp đồng đã ký. Đây là nguồn dữ liệu để tính Forecast Revenue, Potential Revenue và Allocation Revenue.
          synonyms: ["signed revenue", "committed contract", "DTCC"]

        carryover_renew_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Renew' AND is_actual = true AND is_in_year = false THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Renew vắt năm
          description: Doanh thu Actual của các hợp đồng Renew được ghi nhận từ các năm trước.

        in_year_renew_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Renew' AND is_actual = true AND is_in_year = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Renew trong năm
          description: Doanh thu Actual của các hợp đồng Renew phát sinh trong năm hiện tại.

        in_year_renew_provisional_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Renew' AND is_actual = false AND is_in_year = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Renew dự kiến trong năm
          description: Doanh thu Renew chưa Actual trong năm. Khi tính Renewal Revenue và Estimated Revenue sẽ được nhân hệ số 90%.

        renewal_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Renewal' AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Renewal
          description: Doanh thu Actual của các hợp đồng đã hoàn tất gia hạn (Renewal).

        carryover_new_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'New' AND is_actual = true AND is_in_year = false THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu New vắt năm
          description: Doanh thu Actual của các hợp đồng New được ghi nhận từ các năm trước.

        in_year_new_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'New' AND is_actual = true AND is_in_year = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu New trong năm
          description: Doanh thu Actual của các hợp đồng New phát sinh trong năm hiện tại.

        new_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'New' AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu New đã ký
          description: Tổng doanh thu Actual của nhóm sản phẩm New.

        carryover_upsales_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Upsales' AND is_actual = true AND is_in_year = false THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Upsales vắt năm
          description: Doanh thu Actual của Upsales được ghi nhận từ các năm trước.

        in_year_upsales_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Upsales' AND is_actual = true AND is_in_year = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Upsales trong năm
          description: Doanh thu Actual của Upsales phát sinh trong năm hiện tại.

        upsales_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN product_type = 'Upsales' AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Upsales
          description: Tổng doanh thu Actual của nhóm Upsales.

        other_type_committed_revenue_amount:
          type: sum
          sql: "CASE WHEN COALESCE(product_type, '') NOT IN ('New','Renew','Renewal','Upsales') AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu loại khác
          description: Doanh thu Actual của các loại sản phẩm không thuộc New, Renew, Renewal hoặc Upsales.

        committed_non_si_revenue_amount:
          type: sum
          sql: "CASE WHEN product_category <> 'SI' AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu ngoài SI
          description: Doanh thu Actual của các sản phẩm không thuộc nhóm SI.

        committed_si_revenue_amount:
          type: sum
          sql: "CASE WHEN product_category = 'SI' AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu SI
          description: Doanh thu Actual của các sản phẩm thuộc nhóm SI.

        committed_arr_amount:
          type: sum
          sql: "CASE WHEN is_recurring = true AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu ARR
          description: Doanh thu Actual của các sản phẩm có tính chất ARR (Recurring Revenue).

        committed_none_arr_amount:
          type: sum
          sql: "CASE WHEN is_recurring != true AND is_actual = true THEN vnd_amount ELSE 0.0 END"
          label: Doanh thu Non-ARR
          description: Doanh thu Actual của các sản phẩm không thuộc ARR, bao gồm cả giá trị NULL.

