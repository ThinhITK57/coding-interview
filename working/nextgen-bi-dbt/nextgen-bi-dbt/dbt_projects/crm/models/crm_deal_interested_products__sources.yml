version: 2
sources:
- name: bi_silver__crm
  database: hive
  schema: "{{ env_var('DBT_TRINO_SCHEMA', 'bi_silver') }}"
  description: 'Silver layer sources for domain: crm'
  tables:
  - name: crm_deal_interested_products
    description: Bảng này ghi nhận các danh mục sản phẩm mà khách hàng tiềm năng quan tâm trong mỗi giao dịch, hỗ trợ bộ phận kinh doanh nắm bắt nhu cầu và xu hướng mua sắm. Dữ liệu chủ yếu là thông tin về sản phẩm quan tâm kèm thời gian ghi nhận. Thường được dùng để phân tích xu hướng quan tâm, lập báo cáo dự báo nhu cầu và tối ưu chiến lược bán hàng.
    columns:
    - name: deal_id
      description: Mã định danh duy nhất của giao dịch (deal) trong hệ thống CRM.
      tests:
      - not_null
    - name: created_at
      description: Thời điểm mà bản ghi quan tâm sản phẩm được tạo trong hệ thống.
    - name: interested_product_category
      description: Danh mục sản phẩm mà khách hàng quan tâm trong giao dịch.