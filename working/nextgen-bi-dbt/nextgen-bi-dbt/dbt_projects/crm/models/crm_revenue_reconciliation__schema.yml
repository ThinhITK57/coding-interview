version: 2

models:
- name: crm_revenue_reconciliation
  description: >
    Bảng đối soát doanh thu giữa CRM và dữ liệu tài chính theo từng loại tính cước.
    Bảng phục vụ kiểm tra chênh lệch và tổng hợp doanh thu thực hiện theo tháng báo cáo. 
    Doanh thu đã thực hiện, Doanh thu báo cáo cho tập đoàn theo tháng . Doanh thu báo cáo tháng. Doanh thu chốt. 
    Semantic: 
      Bảng chỉ trả về doanh thu, không trả về doanh số, kể cả người dùng có hỏi "doanh số thực hiện"
      Revenue scope:
        Hỏi 'doanh thu', với thời gian trong quá khứ sẽ là 'doanh thu thực hiện' và bóc tách theo cơ cấu
        - Revenue scope được xác định trước các phép phân tích khác.
        - IF query chứa 'doanh thu' AND KHÔNG chứa ('thực hiện' | 'ước' | 'dự kiến' | 'forecast' | 'hóa đơn')
          OR (thời gian bao gồm cả quá khứ + tương lai, ví dụ: 'doanh thu 2026'):
          -> STOP & ASK: Hỏi người dùng chọn: (1) Doanh thu thực hiện, (2) Doanh thu ước tính/Dự báo, (3) Doanh thu Hóa đơn/Chưa hóa đơn
        - Khi người dùng hỏi "doanh thu thực hiện", "doanh thu đã thực hiện",  và chỉ rõ một kỳ đã hoàn tất trong quá khứ, mặc định là Doanh thu thực hiện,
          Thì đưa ra cả 3 số liệu vcs_revenue_amount,actual_revenue_calculated_amount, held_revenue_amount
        - Nếu có "ước", "dự kiến", "forecast", "cả năm", "cuối năm" hoặc thời gian bao gồm kỳ tương lai, ưu tiên Doanh thu ước. 
        - Các yêu cầu "theo khách hàng", "theo SPDV", "theo AM","so với kế hoạch", "cùng kỳ" là chiều hoặc phép phân tích áp dụng trên loại doanh thu đã xác định.
        - Quan hệ bắt buộc:
          vcs_revenue_amount = actual_revenue_calculated_amount + held_revenue_amount.

      Time comparison:
        - Với "cùng kỳ", "YoY", "so với năm trước",
          sử dụng cùng một revenue metric cho kỳ hiện tại và kỳ so sánh.
        - Sử dụng cùng một revenue metric cho kỳ hiện tại  và cùng khoảng thời gian của năm trước.
        - Chênh lệch YoY =  Doanh thu kỳ hiện tại - Doanh thu cùng kỳ năm trước.
        - Tỷ lệ tăng trưởng YoY =   Chênh lệch YoY / Doanh thu cùng kỳ năm trước * 100.

        - Ví dụ:
          Tháng 6/2026 so sánh với tháng 6/2025.
          Quý II/2026 so sánh với quý II/2025.
          Sáu tháng đầu năm 2026 so sánh với sáu tháng đầu năm 2025.

        - Kết quả so sánh phải gồm:
          doanh thu kỳ hiện tại,
          doanh thu cùng kỳ năm trước,
          chênh lệch tuyệt đối,
          tỷ lệ tăng trưởng YoY,
          và kết luận tăng, giảm hoặc không thay đổi.

      Segment scope:
        - Khi người dùng chỉ rõ L1/L2/L3,  sử dụng đúng customer_segment tương ứng.
        - Nếu một giá trị lọc tồn tại ở nhiều cấp customer_segment và người dùng không chỉ rõ cấp, ưu tiên customer_segment_l1.
        - revenue_segment_l1:  Dù người dùng có hỏi "KH" hay không, thì khi hỏi doanh thu , phân bổ doanh thu , kế hoạch doanh thu , tỷ lệ hoàn thành, mà có hỏi đến "phân khúc/cắt lớp" , thì cần sử dụng  revenue_segment_l1. Trừ khi người dùng chỉ định rõ sang cắt lớp khác
        - Khi hỏi đến doanh thu theo trung tâm/đơn vị kinh doanh, sử dụng bảng crm_product_service_group_mapping để lọc lấy product_category rồi filter tiếp bảng này
        - Khi hỏi doanh thu nhóm SDPV tập đoàn (product_service_group) , cần dùng số tập đoàn (không bao gồm phần HOLD) actual_revenue_calculated_amount
        - Khi hỏi doanh thu nhóm SDPV vcs(product_service_group_vcs) , cần dùng số VCS (bao gồm phần HOLD) vcs_revenue_amount
        - Khi hỏi doanh thu nhóm SDPV (có thể cắt lớp theo thời gian), không chỉ rõ nhóm nào thì ưu tiên mặc định nhóm tập đoàn product_service_group. Nếu tên nhóm có trong product_service_group thì ưu tiên, trừ trường hợp người dùng chỉ định rõ nhóm theo VCS

    
  meta:
    label: "Doanh thu thực hiện CRM"
    owner: "huongnv1"
    metrics:
      provisional_revenue_amount:
        type: sum
        sql: CASE WHEN ${billing_type} in ('Tạm tính' , 'TT')  THEN ${actual_revenue_amount} ELSE 0.0 END
        description: Doanh thu tạm tính (billing_type in ('Tạm tính' , 'TT') ). Giá trị này luôn dương.
        label: Doanh thu tạm tính

      invoiced_revenue_amount:
        type: sum
        sql: CASE WHEN ${billing_type} in ('Hóa đơn', 'HD' , 'Phân bổ', 'PB' ) THEN ${actual_revenue_amount} ELSE 0.0 END
        label: Doanh thu hóa đơn
        description: >
          Doanh thu được lấy từ nguồn kế toán theo tháng báo cáo. Giá trị này luôn dương.
        synonyms:
          - Doanh thu xuất hóa đơn
          - Doanh thu thực hiện đã xuất hóa đơn
      uninvoiced_revenue_amount:
        type: sum
        sql: >
          CASE
            WHEN ${billing_type} NOT IN ('Hóa đơn', 'HD', 'HĐ', 'Phân bổ', 'PB')
              OR ${billing_type} IS NULL
            THEN ${actual_revenue_amount}
            ELSE 0.0
          END
        label: Doanh thu chưa hóa đơn
        description: >
          Tổng doanh thu được ghi nhận tại thời điểm báo cáo chưa xuất hóa đơn tài chính
          Bao gồm các bản ghi Tạm tính, Giảm trừ và các loại khác không thuộc nhóm Hóa đơn.
        synonyms:
          - Doanh thu chưa xuất hóa đơn
          - Unbilled Revenue

      revenue_adjustment_amount:
        type: sum
        sql: CASE WHEN ${billing_type} in ('Giảm trừ', 'GT' ) THEN ${actual_revenue_amount} ELSE 0.0 END
        label: Doanh thu giảm trừ
        description: >
          Phần doanh thu đối ứng của doanh thu tạm tính và doanh thu hóa đơn
          theo dữ liệu đối ứng từ Tài chính. Giá trị này luôn âm.
        synonyms:
          - Phần giảm trừ

      other_revenue_amount:
        type: sum
        sql: >
          CASE
            WHEN ${billing_type} IS NULL
              OR ${billing_type} NOT IN (
                'Giảm trừ', 'GT',
                'Tạm tính', 'TT',
                'Hóa đơn', 'HD'
              )
            THEN ${actual_revenue_amount}
            ELSE 0.0
          END
        label: Doanh thu khác
        description: Phần doanh thu khác, không thuộc các nhóm GT, TT, HD.

      actual_revenue_calculated_amount:
        type: sum
        sql: >
          CASE
            WHEN COALESCE(${is_hold}, FALSE) = FALSE
            THEN ${actual_revenue_amount}
            ELSE 0.0
          END
        label: Doanh thu thực hiện báo cáo tập đoàn
        description: >  
          Doanh thu thực hiện báo cáo tập đoàn sau khi hiệu chỉnh từ  Doanh thu thực hiện thực tế theo kỳ. 
          Sử dụng doanh thu HOLD để giữ lại hoặc sử dụng trong quá trình báo cáo tập đoàn
        synonyms:
          - doanh thu thực hiện
          - doanh thu đã thực hiện
          - doanh thu thực hiện theo tháng
          - doanh thu đối soát
          - actual revenue
          - Doanh thu chốt
          - Doanh thu
          - Doanh thu báo cáo tập đoàn

      held_revenue_amount:
        type: sum
        sql: >
          CASE
            WHEN ${is_hold} = TRUE
            THEN ${actual_revenue_amount}
            ELSE 0.0
          END
        label: Doanh thu thực hiện giữ lại/sử dụng
        description: >
          Phần doanh thu thực hiện của VCS đang được để dành
          và chưa tính vào doanh thu báo cáo Tập đoàn.
          Chỉ bao gồm các bản ghi có is_hold = TRUE.
          Không diễn giải held_revenue_amount là toàn bộ doanh thu thực hiện.
        synonyms:
          - doanh thu thực hiện
          - doanh thu đã thực hiện
          - doanh thu để dành
          - doanh thu hold
          - doanh thu giữ lại
          - held revenue
          - Số tiền bù vào/giảm trừ/sử dụng
      vcs_revenue_amount:
        type: sum
        sql: ${actual_revenue_amount}
        label: Doanh thu thực hiện thực tế theo kỳ VCS
        description: >
          Doanh thu thực hiện thực tế theo kỳ VCS= Doanh thu thực hiện báo cáo Tập đoàn + Doanh thu thực hiện giữ lại/sử dụng.
        synonyms:
          - doanh thu thực hiện
          - doanh thu đã thực hiện
          - Doanh thu thực tế
          - doanh thu VCS
          - tổng doanh thu VCS
          - tổng doanh thu bao gồm để dành
          - VCS revenue  
      arr_revenue_amount:
        type: sum
        sql: CASE WHEN ${revenue_frequency_type} in ('Dòng tiền đều', 'DT dòng tiền đều', 'đều' ) THEN ${actual_revenue_amount} ELSE 0.0 END
        label: Doanh thu dòng tiền đều
        description: >
          Doanh thu thực hiện dòng tiền đều
        synonyms:
           - Doanh thu bền vững
           - ARR revenue

