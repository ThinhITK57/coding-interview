version: 2

sources:
- name: bi_silver__hr
  database: hive
  schema: bi_silver
  description: 'Silver layer sources for domain: hr'
  tables:
  - name: hr_ld_employee_certification
    description: >
      Bảng **hr_ld_employee_certification** lưu trữ thông tin chứng chỉ chuyên môn của nhân viên,
      bao gồm thông tin chứng chỉ, kết quả đạt được, thời gian cấp, thời hạn hiệu lực
      và trạng thái hiện tại của chứng chỉ. Dữ liệu được sử dụng để theo dõi năng lực
      chuyên môn, quản lý vòng đời chứng chỉ, đánh giá mức độ tuân thủ yêu cầu nghề nghiệp
      và hỗ trợ lập kế hoạch đào tạo, tái chứng nhận cho nhân viên.

    columns:
    - name: id
      description: Khóa định danh duy nhất của bản ghi chứng chỉ nhân viên
      tests:
        - not_null
        - unique

    - name: month
      description: Tháng ghi nhận thông tin chứng chỉ

    - name: year
      description: Năm ghi nhận thông tin chứng chỉ

    - name: employee_code
      description: Mã định danh duy nhất của nhân viên

    - name: full_name
      description: Họ và tên nhân viên

    - name: division_n
      description: Khối chức năng mà nhân viên trực thuộc

    - name: department_n_2
      description: Phòng ban cấp 2 của nhân viên

    - name: role_base
      description: Nhóm vai trò hoặc chức danh cơ sở của nhân viên

    - name: level
      description: Cấp bậc hoặc level hiện tại của nhân viên

    - name: employee_object
      description: Nhóm đối tượng nhân sự theo phân loại quản trị nội bộ

    - name: certificate_check_flag
      description: Cờ xác định nhân viên có thuộc đối tượng yêu cầu kiểm tra chứng chỉ hay không

    - name: certificate_status
      description: Trạng thái sở hữu hoặc đáp ứng chứng chỉ của nhân viên

    - name: certificate_name
      description: Tên chứng chỉ chuyên môn

    - name: certificate_level
      description: Cấp độ hoặc hạng của chứng chỉ

    - name: certificate_result
      description: Kết quả đạt được của chứng chỉ hoặc kỳ thi chứng chỉ

    - name: certificate_type
      description: Loại chứng chỉ theo nhóm chuyên môn hoặc nghiệp vụ

    - name: certificate_issue_date
      description: Ngày cấp chứng chỉ

    - name: certificate_validity_period
      description: Thời hạn hiệu lực của chứng chỉ

    - name: certificate_expiry_date
      description: Ngày hết hạn của chứng chỉ

    - name: certificate_current_status
      description: Trạng thái hiện tại của chứng chỉ (Còn hiệu lực/Hết hiệu lực/Sắp hết hạn...)