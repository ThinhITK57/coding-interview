version: 2

sources:
- name: bi_silver__hr
  database: hive
  schema: bi_silver
  description: 'Silver layer sources for domain: hr'

  tables:
  - name: hr_ld_fresher_resignation
    description: >
      Bảng **hr_ld_fresher_resignation** lưu trữ thông tin các nhân sự Fresher nghỉ việc
      trong quá trình tham gia chương trình đào tạo hoặc giai đoạn thực tập công việc (OJT).
      Dữ liệu bao gồm thông tin cá nhân, thời gian nghỉ việc, lý do nghỉ việc, lộ trình đào tạo,
      người hướng dẫn và đơn vị công tác. Dữ liệu được sử dụng để phân tích tỷ lệ nghỉ việc của
      Fresher, đánh giá hiệu quả chương trình đào tạo và hỗ trợ xây dựng các chính sách giữ chân
      nhân sự mới.

    columns:
    - name: id
      description: Khóa định danh duy nhất của bản ghi nghỉ việc của Fresher
      tests:
        - not_null

    - name: full_name
      description: Họ và tên của nhân sự Fresher

    - name: employee_code
      description: Mã định danh của nhân sự Fresher

    - name: onboard_date
      description: Ngày nhân sự Fresher bắt đầu tham gia chương trình đào tạo hoặc gia nhập công ty

    - name: resigned_date
      description: Ngày nhân sự Fresher nghỉ việc

    - name: resignation_reason
      description: Lý do nghỉ việc của nhân sự Fresher

    - name: training_phase
      description: Giai đoạn đào tạo mà Fresher đang tham gia tại thời điểm nghỉ việc

    - name: training_major
      description: Chuyên ngành hoặc định hướng đào tạo của Fresher

    - name: mentor_name
      description: Họ và tên người hướng dẫn hoặc mentor phụ trách Fresher

    - name: department_n_2
      description: Phòng ban cấp 2 tiếp nhận hoặc quản lý Fresher

    - name: ojt_start_date
      description: Ngày bắt đầu chương trình đào tạo thực tế tại công việc (On-the-Job Training)

    - name: ojt_end_date
      description: Ngày kết thúc chương trình đào tạo thực tế tại công việc (On-the-Job Training)

    - name: current_work_location
      description: Địa điểm hoặc khu vực làm việc của Fresher tại thời điểm nghỉ việc