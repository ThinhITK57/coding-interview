name: 'investment'
version: '1.0.0'
profile: 'investment'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  investment:
    +materialized: "{{ env_var('DBT_MATERIALIZED', 'ephemeral') }}"
    +schema: "{{ env_var('DBT_TRINO_SCHEMA', 'bi_gold') }}"
    +tags: ['investment']
    +meta:
      openmetadata:
        service: investment-gold