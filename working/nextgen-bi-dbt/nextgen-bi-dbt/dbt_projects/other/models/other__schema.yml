version: 2

models:
  - name: company_contacts
    description: "Bảng này lưu trữ thông tin liên hệ của các công ty, bao gồm tên công ty, tên hiển thị, họ và tên, địa chỉ email và nguồn hệ thống gốc. Nó hỗ trợ việc quản lý quan hệ khách hàng và cho phép thực hiện các báo cáo phân tích danh sách liên hệ, nguồn dữ liệu và thời gian cập nhật."
    meta:
      label: "Company Contacts"


    columns:
      - name: company_id
        description: "Mã định danh duy nhất của công ty trong hệ thống CRM."


        tests:
          - not_null
          - unique
      - name: company_name
        description: "Tên công ty mà liên hệ thuộc về trong hệ thống CRM."

        meta:
          dimension:
            label: "tên công ty"


      - name: source_system
        description: "Hệ thống nguồn mà thông tin liên hệ được lấy về."

        meta:
          dimension:
            label: "hệ thống nguồn"


      - name: contact_id
        description: "Column contact_id from bi_silver.company_contacts"


      - name: contact_name
        description: "Tên hiển thị của liên hệ trong hệ thống CRM."

        meta:
          dimension:
            label: "tên hiển thị"


      - name: first_name
        description: "Column first_name from bi_silver.company_contacts"


      - name: last_name
        description: "Column last_name from bi_silver.company_contacts"


      - name: email
        description: "Địa chỉ email của liên hệ công ty."

        meta:
          dimension:
            label: "Email"


      - name: email_domain
        description: "Column email_domain from bi_silver.company_contacts"


      - name: created_at
        description: "Thời điểm mà bản ghi liên hệ công ty được tạo trong hệ thống."

        meta:
          dimension:
            label: "ngày tạo"


      - name: updated_at
        description: "Thời điểm cuối cùng mà thông tin liên hệ công ty được cập nhật."

        meta:
          dimension:
            label: "thời gian cập nhật"


  - name: contract_collected_invoices
    description: "Staging model selecting data from source bi_silver.contract_collected_invoices"
    meta:
      label: "Collected Invoices"


