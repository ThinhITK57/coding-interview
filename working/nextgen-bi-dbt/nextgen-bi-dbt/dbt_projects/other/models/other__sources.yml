  - name: company_contacts
    description: "Bảng này lưu trữ thông tin liên hệ của các công ty, bao gồm tên công ty, tên hiển thị, họ và tên, địa chỉ email và nguồn hệ thống gốc. Nó hỗ trợ việc quản lý quan hệ khách hàng và cho phép thực hiện các báo cáo phân tích danh sách liên hệ, nguồn dữ liệu và thời gian cập nhật."
    columns:
    - name: company_id
      description: "Mã định danh duy nhất của công ty trong hệ thống CRM."
      tests:
      - not_null
      - unique
    - name: company_name
      description: Tên công ty mà liên hệ thuộc về trong hệ thống CRM.
    - name: source_system
      description: Hệ thống nguồn mà thông tin liên hệ được lấy về.
