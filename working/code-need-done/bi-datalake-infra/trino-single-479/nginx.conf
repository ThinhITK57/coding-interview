server {
    listen 9000 ssl http2;
    server_name datalake-trino-bi.viettelcyber.com;

    ssl_certificate /etc/nginx/ssl/trino.crt;
    ssl_certificate_key /etc/nginx/ssl/trino.key;

    access_log /var/log/nginx/trino_access.log;
    error_log  /var/log/nginx/trino_error.log warn;

    location / {
        proxy_pass http://localhost:8443;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}