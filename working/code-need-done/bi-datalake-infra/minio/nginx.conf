server {
    listen 9000  ssl http2;
    server_name minio-ingestion.viettelcyber.com datalake-s3.viettelcyber.com;

    ssl_certificate     /etc/nginx/ssl/minio.crt;
    ssl_certificate_key /etc/nginx/ssl/minio.key;

    access_log /var/log/nginx/minio/console_http_access.log;
    error_log  /var/log/nginx/minio/console_http_error.log;
    client_max_body_size 0;

#    location /api/v1/buckets/kinhdoanh/quota {
#        default_type application/json;
#        add_header Cache-Control "no-store";
#        return 200 '{"enabled":false}';
#    }

    location /api {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_pass http://127.0.0.1:19001;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # Hỗ trợ WebSocket cho Web UI
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://127.0.0.1:19001;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-eval' 'unsafe-inline'; img-src * data:;" always;

        # Bỏ các thuộc tính Secure của Cookie vì đang dùng HTTP
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
    }

}


