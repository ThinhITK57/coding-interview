services:
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z-cpuv1
    container_name: minio
    restart: always
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - /u01/minio/data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      MINIO_BROWSER: "on"
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "Welcome1"
      MINIO_BROWSER_REDIRECT_URL: "https://10.255.245.150:9001"
      MINIO_SERVER_URL: "https://10.255.245.150:9000"
    command: server /data --address ":9000" --console-address ":9001"