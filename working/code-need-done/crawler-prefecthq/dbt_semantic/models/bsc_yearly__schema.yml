version: 2

models:
  - name: bsc_yearly
    description: >
      Báo cáo BSC trong năm (Business Requirement 1).
      Cung cấp bức tranh toàn cảnh về tiến độ hoàn thành các chỉ tiêu định lượng (Targets)
      gắn liền với Mục tiêu chiến lược BSC (Objectives) và Dự án (Projects).
      Bảng vật lý chỉ chứa đúng 17 cột dữ liệu gốc/chuẩn hóa được DA phê duyệt.
      Mọi chỉ số tính toán suy diễn (Measures/Metrics) được định nghĩa tại tầng Semantic Layer của dbt.

      Grain: Một dòng tương ứng với một chỉ tiêu định lượng thuộc kỳ đánh giá BSC.

    meta:
      label: "Báo cáo BSC Trong Năm"
      group_label: "Executive EPM Reports"
      owner: "data_engineering_team"

      # ================================================================
      # SEMANTIC GUIDANCE
      # ================================================================
      semantic_guidance:
        source_type: "Targets joined with Objectives & Assignments"
        grain: "One row per quantitative BSC target"
        primary_date: "target_date_m"
        primary_department_dimension: "c_department"
        primary_assignee_dimension: "c_assignee"
        primary_objective_dimension: "associated_objective"

        metric_rules:
          total_targets_count: >
            Tổng số chỉ tiêu định lượng trong kỳ BSC.
          achieved_m_targets_count: >
            Số lượng chỉ tiêu đã đạt hoặc vượt mốc cam kết tối thiểu M (target_result_m >= target_value_m).
          achieved_n_targets_count: >
            Số lượng chỉ tiêu đã đạt mốc nâng cao N (target_result_n >= target_value_n).
          total_target_value_m: >
            Tổng giá trị cam kết mức tối thiểu M toàn công ty/phòng ban.
          total_target_result_m: >
            Tổng kết quả thực tế đạt được mức M.
          overall_achievement_rate_m: >
            Tỷ lệ hoàn thành tổng thể mức M: (Tổng result_m / Tổng value_m) * 100%.
          total_target_gap_m: >
            Tổng chênh lệch còn thiếu so với mục tiêu M: Tổng value_m - Tổng result_m.

        restrictions:
          - >
            Không thực hiện tính toán cột suy diễn trực tiếp trong bảng vật lý.
          - >
            Chỉ tiêu M (Must-have) là chỉ tiêu bắt buộc phải đạt theo cam kết KPI.
          - >
            Chỉ tiêu N (Nice-to-have) là chỉ tiêu khuyến khích phấn đấu thêm.
          - >
            Dùng c_department làm chiều lọc chính cho cấp đơn vị/phòng ban.
          - >
            Không tự cộng gộp các chỉ tiêu khác đơn vị tính (unit) trừ khi tính theo % hoặc count.

      # ================================================================
      # METRICS (LIGHTDASH / DBT METRIC SPECIFICATION)
      # ================================================================
      metrics:
        # ------------------------------------------------
        # VOLUME & COUNT METRICS
        # ------------------------------------------------
        - name: total_targets_count
          label: "Tổng số chỉ tiêu"
          description: "Tổng số lượng chỉ tiêu định lượng BSC."
          type: count
          sql: ${name}

        - name: unique_objectives_count
          label: "Số mục tiêu chiến lược duy nhất"
          description: "Số lượng mục tiêu cấp công ty/khối (Objectives) có gắn chỉ tiêu."
          type: count_distinct
          sql: ${associated_objective}

        - name: unique_departments_count
          label: "Số phòng ban cam kết"
          description: "Số lượng phòng ban/đơn vị tham gia thực hiện chỉ tiêu BSC."
          type: count_distinct
          sql: ${c_department}

        - name: achieved_m_targets_count
          label: "Số chỉ tiêu đạt mốc M"
          description: "Số lượng chỉ tiêu đạt hoặc vượt mức cam kết tối thiểu M."
          type: count
          sql: |
            CASE
              WHEN ${target_result_m} >= ${target_value_m} AND ${target_value_m} > 0
              THEN ${name}
            END

        - name: achieved_n_targets_count
          label: "Số chỉ tiêu đạt mốc N"
          description: "Số lượng chỉ tiêu đạt mốc khuyến khích nâng cao N."
          type: count
          sql: |
            CASE
              WHEN ${target_result_n} >= ${target_value_n} AND ${target_value_n} > 0
              THEN ${name}
            END

        # ------------------------------------------------
        # VALUE & GAP METRICS
        # ------------------------------------------------
        - name: total_target_value_m
          label: "Tổng giá trị mục tiêu M"
          description: "Tổng giá trị định lượng cam kết bắt buộc M."
          type: sum
          sql: ${target_value_m}

        - name: total_target_result_m
          label: "Tổng kết quả thực đạt M"
          description: "Tổng kết quả thực tế đạt được ở mốc M."
          type: sum
          sql: ${target_result_m}

        - name: total_target_gap_m
          label: "Tổng khoảng cách GAP M"
          description: "Tổng chênh lệch giá trị còn thiếu giữa cam kết M và kết quả thực tế."
          type: number
          sql: |
            SUM(COALESCE(${target_value_m}, 0.0)) - SUM(COALESCE(${target_result_m}, 0.0))

        - name: overall_achievement_rate_m
          label: "Tỷ lệ đạt mục tiêu M (%)"
          description: "Tỷ lệ hoàn thành mức tối thiểu M toàn bộ danh mục chỉ tiêu."
          type: number
          sql: |
            CASE
              WHEN SUM(COALESCE(${target_value_m}, 0.0)) > 0
              THEN (SUM(COALESCE(${target_result_m}, 0.0)) * 100.0) / SUM(COALESCE(${target_value_m}, 0.0))
              ELSE NULL
            END

        - name: overall_achievement_rate_n
          label: "Tỷ lệ đạt mục tiêu N (%)"
          description: "Tỷ lệ hoàn thành mức nâng cao N toàn bộ danh mục chỉ tiêu."
          type: number
          sql: |
            CASE
              WHEN SUM(COALESCE(${target_value_n}, 0.0)) > 0
              THEN (SUM(COALESCE(${target_result_n}, 0.0)) * 100.0) / SUM(COALESCE(${target_value_n}, 0.0))
              ELSE NULL
            END

    columns:
      - name: associated_objective
        description: "Khóa ngoại trỏ đến Mục tiêu chiến lược BSC (SYSID của bảng Objectives)."
        meta:
          dimension:
            type: string
            label: "Mã Mục tiêu BSC"

      - name: associated_item
        description: "Khóa ngoại trỏ đến Dự án liên kết thực hiện (SYSID của bảng Projects)."
        meta:
          dimension:
            type: string
            label: "Mã Dự án Liên kết"

      - name: target_type
        description: "Phân loại chỉ tiêu (Càng cao càng tốt, Càng thấp càng tốt, Duy trì trong ngưỡng)."
        meta:
          dimension:
            type: string
            label: "Loại Chỉ tiêu"

      - name: parent_target
        description: "Khóa ngoại trỏ đến Chỉ tiêu cha cấp trên (Phân cấp cây chỉ tiêu)."
        meta:
          dimension:
            type: string
            label: "Chỉ tiêu Cha"

      - name: c_department
        description: "Phòng ban / Đơn vị chịu trách nhiệm thực hiện chỉ tiêu."
        meta:
          dimension:
            type: string
            label: "Phòng ban"

      - name: name
        description: "Tên chỉ tiêu định lượng (ví dụ: Tăng trưởng doanh thu 25%)."
        meta:
          dimension:
            type: string
            label: "Tên Chỉ tiêu"

      - name: c_assignee
        description: "Cán bộ / Nhân sự được giao cam kết thực hiện chỉ tiêu."
        meta:
          dimension:
            type: string
            label: "Người Thực hiện"

      - name: unit
        description: "Đơn vị tính (%, VND, USD, Khách hàng, Hệ thống)."
        meta:
          dimension:
            type: string
            label: "Đơn vị tính"

      - name: target_date_m
        description: "Hạn chốt hoàn thành mức cam kết tối thiểu (Must-have)."
        meta:
          dimension:
            type: date
            label: "Hạn chốt M"

      - name: target_value_m
        description: "Giá trị định lượng cam kết bắt buộc phải đạt (M)."
        meta:
          dimension:
            type: number
            label: "Giá trị Mục tiêu M"

      - name: target_date_n
        description: "Hạn chốt hoàn thành mức nâng cao khuyến khích (Nice-to-have)."
        meta:
          dimension:
            type: date
            label: "Hạn chốt N"

      - name: target_value_n
        description: "Giá trị định lượng mục tiêu nâng cao (N)."
        meta:
          dimension:
            type: number
            label: "Giá trị Mục tiêu N"

      - name: state
        description: "Trạng thái vòng đời chỉ tiêu (/State/Active, /State/Completed)."
        meta:
          dimension:
            type: string
            label: "Trạng thái Vòng đời"

      - name: status
        description: "Đánh giá hiện trạng tiến độ (Đạt, Vượt, Chưa đạt, Đang theo dõi)."
        meta:
          dimension:
            type: string
            label: "Tình trạng Tiến độ"

      - name: target_result_m
        description: "Kết quả thực tế đạt được tương ứng với mốc M."
        meta:
          dimension:
            type: number
            label: "Kết quả Thực tế M"

      - name: target_result_n
        description: "Kết quả thực tế đạt được tương ứng với mốc N."
        meta:
          dimension:
            type: number
            label: "Kết quả Thực tế N"

      - name: assignor
        description: "Lãnh đạo / Người giao chỉ tiêu (trích xuất từ PGNV hoặc trường c_assignor)."
        meta:
          dimension:
            type: string
            label: "Người Giao"