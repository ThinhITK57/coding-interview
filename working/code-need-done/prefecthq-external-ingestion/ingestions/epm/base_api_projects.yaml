api:
  name: clarizen
  version: v2.0

  base_url: https://api2.clarizen.com

  endpoints:

    - name: projects

      path: /v2.0/services/data/entityQuery

      method: POST

      headers:
        Content-Type: application/json

      auth:
        type: api_key
        credentials:
          header_name: Authorization
          value_env: ${PROJECT_API_KEY}
          prefix: "ApiKey"

      timeout_seconds: 30

      rate_limit:
        requests_per_minute: 60
        requests_per_day: 10000

      retry:
        max_attempts: 5
        backoff_factor: 2
        max_backoff_seconds: 60

      pagination:
        type: offset
        location: body
        page_size: 50

        max_pages: 10000

        offset_param: from

        limit_param: limit

      body:
        typeName: Project

        fields:
          - SYSID
          - Name
          - State
          - PercentCompleted
          - StartDate
          - DueDate

        paging:
          from: 0
          limit: 50


job:
  job_name: clarizen_task_ingestion

  source: project_api

  endpoint: entity_query

  api_version: v2.0

  extraction:
    mode: full

    batch_size: 50

    max_records: 1000000

    max_pages: 10000

    max_runtime_seconds: 3600

  checkpoint:
    enabled: true

    store_type: file

    path: ./checkpoints/clarizen_task

  storage:
    format: parquet

    layer: bronze

    path: ./data/bronze/clarizen/task

    partition_columns:
      - ingest_date

    compression: snappy