      description: Cờ xác nhận số giờ thực tế đã được đồng bộ tự động từ Timesheet.
    - name: ActualEndDate
      description: Thời điểm thực tế công việc được xác nhận hoàn thành (100%).
    - name: ActualExpenses
      description: (chưa có mô tả trong tài liệu)
    - name: ActualNetRevenue
      description: (chưa có mô tả trong tài liệu)
    - name: ActualThirdPartyNLRNonBillableCosts
      description: (chưa có mô tả trong tài liệu)
    - name: ActualNonBillableHours
      description: Số giờ nội bộ không thể tính tiền cho khách hàng.
    - name: ActualRevenue
      description: Doanh thu thực tế đã ghi nhận.
    - name: ActualRevenueNLR
      description: (chưa có mô tả trong tài liệu)
    - name: ActualStartDate
