version: 2
sources:
- name: bi_silver__epm
  database: hive
  schema: '{{ env_var(''DBT_TRINO_SCHEMA'', ''bi_silver'') }}'
  description: 'Silver layer sources for domain: epm'
  tables:
  - name: 1_task
    description: Source table 1_task in hive.bi_silver
    columns:
    - name: AllUserResourcesAndPlaceholdersCount
      description: (chưa có mô tả trong tài liệu)
    - name: AllUserResourcesCount
      description: Tổng nhân sự tính cả phân cấp task con.
    - name: AttachmentsCount
      description: Số lượng tài liệu đính kèm (Biên bản giao ban, Nghị quyết, Quyết
        định). [mô tả lấy từ bảng OBJECTIVE]
    - name: IssuesCount
      description: Số lượng sự cố/vấn đề đang mở cần giải quyết gắn với task này.
    - name: ChildrenCount
      description: Số lượng task con trực thuộc.
    - name: EmailsCount
      description: Số lượng ghi chú trao đổi và email trao đổi gắn với task.
    - name: LikesCount
      description: (chưa có mô tả trong tài liệu)
    - name: NotesCount
      description: Số lượng ghi chú trao đổi và email trao đổi gắn với task.
    - name: PredecessorsCount
      description: Số lượng task tiền nhiệm (phải hoàn thành trước khi task này bắt
        đầu).
    - name: ResourcesAndPlaceholdersCount
      description: 'Tổng số nhân sự thật + vai trò giữ chỗ (Placeholder, ví dụ: Senior
        Dev).'
    - name: ChildShortcutCount
      description: Số lượng đường dẫn tắt (shortcut links) trỏ đến task con.
    - name: SuccessorsCount
      description: Số lượng task kế nhiệm (bị phụ thuộc vào tiến độ của task này).
    - name: UserResourcesCount
      description: Số lượng nhân sự thật (Named Users) được gán vào task.
    - name: PostsCount
      description: (chưa có mô tả trong tài liệu)
    - name: PercentCompleted
      description: '% hoàn thành tổng thể của công việc (0.0 rightarrow 100.0%).'
    - name: LaborCostPercentComplete
      description: (chưa có mô tả trong tài liệu)
    - name: CompletnessDefinition
      description: (chưa có mô tả trong tài liệu)
    - name: PercentInvested
      description: (chưa có mô tả trong tài liệu)
    - name: PercentProfitability
      description: (chưa có mô tả trong tài liệu)
    - name: ActiveStopwatch
      description: Cờ có đồng hồ bấm giờ (Stopwatch) đang chạy trực tiếp hay không.
    - name: ActualThirdPartyNLRCosts
      description: (chưa có mô tả trong tài liệu)
    - name: ActualThirdPartyNLRBillableCosts
      description: (chưa có mô tả trong tài liệu)
    - name: ActualBillableHours
