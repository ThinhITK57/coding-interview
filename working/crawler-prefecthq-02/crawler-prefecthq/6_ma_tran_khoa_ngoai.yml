        tác.
    - name: ActualBilledExpenses
      description: (chưa có mô tả trong tài liệu)
    - name: ActualNetProfit
      description: 'Lợi nhuận ròng thực tế: text{ActualRevenue} - text{ActualCost}.'
    - name: ActualNetProfitability
      description: 'Tỷ suất lợi nhuận thực tế: frac{text{ActualNetProfit}}{text{ActualRevenue}}
        x 100%.'
    - name: ActualCost
      description: Tổng chi phí thực tế đã giải ngân (AC - Actual Cost).
    - name: ActualCostCAPEX
      description: Chi phí CAPEX thực tế đã hạch toán.
    - name: CapexActualYTD
      description: Chi phí CAPEX lũy kế từ đầu năm tài chính đến hiện tại (Year-To-Date).
    - name: ActualCostLR
      description: 'Chi phí nhân công thực tế: sum (text{Giờ làm} x text{Đơn giá nhân
        sự}).'
    - name: ActualLaborAndThirdPartyNLRNonBillableCosts
      description: (chưa có mô tả trong tài liệu)
    - name: ActualCostNLR
      description: Chi phí vật tư, bản quyền, thiết bị thực tế phát sinh.
    - name: ActualCostNLRCapex
      description: (chưa có mô tả trong tài liệu)
    - name: ActualCostNLROpex
      description: (chưa có mô tả trong tài liệu)
    - name: ActualCostOPEX
