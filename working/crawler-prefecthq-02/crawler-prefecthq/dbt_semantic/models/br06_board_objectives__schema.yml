version: 2

models:
  - name: br06_board_objectives
    description: >
      Báo cáo Mục tiêu Ban Giám đốc (Mục tiêu BG - BR-06).
      Tập trung giám sát tiến độ thực hiện các chỉ tiêu cấp cao nhất của Ban Giám đốc giao ban,
      đối chiếu giá trị cam kết (M/N) và kết quả giải ngân/thực đạt (Result M/N).
      Bảng vật lý chỉ chứa đúng 17 cột dữ liệu thuần túy theo yêu cầu.
      Toàn bộ công thức tính tỷ lệ hoàn thành Ban Giám đốc và mức chênh lệch GAP nằm tại dbt Semantic Layer.

      Grain: Một dòng tương ứng với một chỉ tiêu cấp Ban Giám đốc.

    meta:
      label: "Báo Cáo Mục Tiêu Ban Giám Đốc (BR-06)"
      group_label: "Executive EPM Reports"
      owner: "data_engineering_team"

      semantic_guidance:
        source_type: "Board Targets"
        grain: "One row per board quantitative target"
        primary_department_dimension: "c_department"
        primary_assignee_dimension: "c_assignee"
        primary_assignor_dimension: "c_assignor"

        restrictions:
          - "Bảng vật lý không chứa các phép chia tính tỷ lệ hoàn thành."
          - "Các công thức dưới đây phục vụ trực tiếp cho Trợ lý GenBI và Dashboard Ban Giám đốc."

        derived_measures:
          - name: "bg_achievement_rate_m"
            label: "Tỷ Lệ Đạt Mục Tiêu BG M (%)"
            formula: "CASE WHEN c_target_value_m > 0 THEN (c_target_result_m / c_target_value_m) * 100.0 ELSE NULL END"
            description: "Tỷ lệ thực tế hoàn thành so với cam kết tối thiểu Ban Giám đốc giao (M)."
            format: "percentage"

          - name: "bg_achievement_rate_n"
            label: "Tỷ Lệ Đạt Mục Tiêu BG N (%)"
            formula: "CASE WHEN c_target_value_n > 0 THEN (c_target_result_n / c_target_value_n) * 100.0 ELSE NULL END"
            description: "Tỷ lệ thực tế hoàn thành so với cam kết nâng cao Ban Giám đốc giao (N)."
            format: "percentage"

          - name: "bg_gap_m"
            label: "Khoảng Cách GAP Mục Tiêu M"
            formula: "c_target_value_m - COALESCE(c_target_result_m, 0.0)"
            description: "Giá trị còn thiếu để đạt mốc M của Ban Giám đốc."
            format: "decimal"

          - name: "bg_gap_n"
            label: "Khoảng Cách GAP Mục Tiêu N"
            formula: "c_target_value_n - COALESCE(c_target_result_n, 0.0)"
            description: "Giá trị còn thiếu để đạt mốc N của Ban Giám đốc."
            format: "decimal"

    columns:
      - name: associated_objective
        description: "Mã mục tiêu chiến lược BSC liên kết."
        meta:
          dimension:
            type: string
            label: "Mục Tiêu BSC"

      - name: associated_item
        description: "Mã dự án trọng điểm liên kết thực hiện."
        meta:
          dimension:
            type: string
            label: "Dự Án Liên Kết"

      - name: target_type
        description: "Phân loại chỉ tiêu Ban Giám đốc."
        meta:
          dimension:
            type: string
            label: "Loại Chỉ Tiêu"

      - name: parent_target
        description: "Chỉ tiêu cha cấp trên (nếu có)."
        meta:
          dimension:
            type: string
            label: "Chỉ Tiêu Cha"

      - name: c_department
        description: "Khối / Phòng ban chịu trách nhiệm chính trước Ban Giám đốc."
        meta:
          dimension:
            type: string
            label: "Phòng Ban"

      - name: name
        description: "Tên chỉ tiêu Ban Giám đốc giao."
        meta:
          dimension:
            type: string
            label: "Tên Chỉ Tiêu"

      - name: c_assignee
        description: "Cán bộ quản lý được Ban Giám đốc giao nhận nhiệm vụ."
        meta:
          dimension:
            type: string
            label: "Người Nhận Việc"

      - name: unit
        description: "Đơn vị tính chỉ tiêu."
        meta:
          dimension:
            type: string
            label: "Đơn Vị Tính"

      - name: c_target_date_m
        description: "Hạn chót cam kết hoàn thành mức M của Ban Giám đốc."
        meta:
          dimension:
            type: date
            label: "Hạn Chốt M"

      - name: c_target_date_n
        description: "Hạn chót cam kết hoàn thành mức N của Ban Giám đốc."
        meta:
          dimension:
            type: date
            label: "Hạn Chốt N"

      - name: c_target_value_m
        description: "Giá trị cam kết mức tối thiểu Ban Giám đốc giao (M)."
        meta:
          measure:
            type: sum
            label: "Giá Trị Mục Tiêu M"

      - name: c_target_value_n
        description: "Giá trị cam kết mức nâng cao Ban Giám đốc giao (N)."
        meta:
          measure:
            type: sum
            label: "Giá Trị Mục Tiêu N"

      - name: c_target_result_m
        description: "Kết quả thực tế ghi nhận mức M."
        meta:
          measure:
            type: sum
            label: "Kết Quả Thực Đạt M"

      - name: c_target_result_n
        description: "Kết quả thực tế ghi nhận mức N."
        meta:
          measure:
            type: sum
            label: "Kết Quả Thực Đạt N"

      - name: state
        description: "Trạng thái vòng đời (/State/Active, /State/Completed)."
        meta:
          dimension:
            type: string
            label: "Trạng Thái Vòng Đời"

      - name: status
        description: "Đánh giá tình trạng thực hiện hiện tại."
        meta:
          dimension:
            type: string
            label: "Hiện Trạng"

      - name: c_assignor
        description: "Thành viên Ban Giám đốc giao nhiệm vụ."
        meta:
          dimension:
            type: string
            label: "Thành Viên BGĐ Giao Việc"
