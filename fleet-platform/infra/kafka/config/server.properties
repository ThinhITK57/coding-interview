# Kafka Broker Configuration for Fleet Platform — TEMPLATE
# =========================================================
# Kafka multi-broker cluster: 3 brokers (master, slave1, slave2)
# Mỗi node cần 1 bản server.properties riêng, chỉ khác 2 dòng:
#   - broker.id  (0, 1, 2)
#   - advertised.listeners  (master, slave1, slave2)
#
# HƯỚNG DẪN:
#   Trên master : broker.id=0, advertised.listeners=PLAINTEXT://master:9092
#   Trên slave1 : broker.id=1, advertised.listeners=PLAINTEXT://slave1:9092
#   Trên slave2 : broker.id=2, advertised.listeners=PLAINTEXT://slave2:9092
# =========================================================

############################# Server Basics #############################

# === THAY ĐỔI THEO TỪNG NODE ===
# master=0, slave1=1, slave2=2
broker.id=__BROKER_ID__

############################# Socket Server Settings #############################

# Lắng nghe trên tất cả interfaces, port 9092
listeners=PLAINTEXT://0.0.0.0:9092

# === THAY ĐỔI THEO TỪNG NODE ===
# Hostname mà clients (Spark, Debezium, Python producers) dùng để kết nối broker này
# QUAN TRỌNG: phải là hostname resolvable từ tất cả nodes
advertised.listeners=PLAINTEXT://__HOSTNAME__:9092

# Số threads xử lý network I/O
num.network.threads=3

# Số threads xử lý disk I/O (đọc/ghi log)
num.io.threads=8

# Buffer sizes
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log (Message Storage) #############################

# Thư mục lưu Kafka log segments (= nơi message được ghi xuống disk)
log.dirs=/opt/kafka/kafka-logs

# Số partitions mặc định khi tạo topic mới
num.partitions=3

# Số threads dùng cho recovery khi startup
num.recovery.threads.per.data.dir=1

############################# Replication (PRODUCTION) #############################

# 3 brokers → replication factor = 3 (mỗi partition có 3 bản copy trên 3 brokers)
# Mất 1 broker → dữ liệu vẫn an toàn trên 2 brokers còn lại
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3

# min.insync.replicas = 2: producer cần ít nhất 2 brokers xác nhận ghi thành công
# → đảm bảo dữ liệu tồn tại trên ≥ 2 nodes trước khi trả lời producer OK
# → chịu được 1 broker down mà không mất data
transaction.state.log.min.isr=2

# Default min ISR cho tất cả topics
default.replication.factor=3
min.insync.replicas=2

############################# Log Retention #############################

# Giữ message 7 ngày (đủ cho batch job chạy weekly)
# Telemetry đã được Spark Streaming ghi xuống HDFS Parquet → Kafka chỉ là buffer
log.retention.hours=168

# Kích thước tối đa 1 log segment (1GB) trước khi tạo segment mới
log.segment.bytes=1073741824

# Interval kiểm tra log cần xóa
log.retention.check.interval.ms=300000

############################# Zookeeper #############################

# Zookeeper chạy trên master
zookeeper.connect=master:2181

# Timeout kết nối Zookeeper
zookeeper.connection.timeout.ms=18000

############################# Group Coordinator #############################

# Delay 3s khi consumer group rebalance (cho tất cả consumers kịp join)
# Production nên > 0 để tránh rebalance liên tục khi deploy rolling
group.initial.rebalance.delay.ms=3000

############################# Auto Topic Creation #############################

# TẮT auto-create trong production — buộc phải tạo topic thủ công với đúng config
# Debezium topics đã được tạo sẵn trong create-topics.sh
auto.create.topics.enable=false

# Cleanup policy mặc định: delete (giữ theo retention)
log.cleanup.policy=delete

############################# Rack Awareness (optional) #############################

# Nếu 3 nodes nằm trên 3 rack/AZ khác nhau, uncomment:
# broker.rack=rack-0
