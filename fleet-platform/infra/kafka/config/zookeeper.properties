# Zookeeper Configuration for Fleet Platform
# Location: /opt/kafka/config/zookeeper.properties

# Thư mục lưu snapshot data của Zookeeper
dataDir=/opt/kafka/zookeeper-data

# Port client kết nối (Kafka sẽ connect vào port này)
clientPort=2181

# Giới hạn số kết nối từ 1 IP (0 = unlimited)
maxClientCnxns=0

# Tick time (ms) - heartbeat interval
tickTime=2000

# Số tick cho phép follower sync với leader khi khởi động
initLimit=10

# Số tick cho phép follower sync trong quá trình chạy
syncLimit=5

# Disable AdminServer (không cần cho lab)
admin.enableServer=false
