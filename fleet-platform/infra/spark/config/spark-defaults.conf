# Spark Default Configuration for Fleet Platform
# Location: /opt/spark/conf/spark-defaults.conf

# =============================================================
# Master
# =============================================================
spark.master                       spark://master:7077

# =============================================================
# Memory & Resources
# =============================================================
# Driver memory (master node, chạy DAG logic)
spark.driver.memory                1g

# Executor memory (trên slave1, slave2 — chạy task xử lý data)
spark.executor.memory              1g
spark.executor.cores               2

# =============================================================
# Serialization
# =============================================================
# Kryo nhanh hơn Java serialization mặc định
spark.serializer                   org.apache.spark.serializer.KryoSerializer

# =============================================================
# HDFS Integration
# =============================================================
# Thư mục default cho các file output
spark.hadoop.fs.defaultFS          hdfs://master:9000

# Warehouse directory trên HDFS (cho Spark SQL tables)
spark.sql.warehouse.dir            hdfs:///fleet-datalake/warehouse

# =============================================================
# Kafka Integration (Structured Streaming)
# =============================================================
# Kafka bootstrap servers — dùng trong Spark Streaming jobs
# (cũng có thể set trong code, nhưng đặt ở đây làm default)
spark.kafka.bootstrap.servers      master:9092,slave1:9092,slave2:9092

# =============================================================
# Streaming
# =============================================================
# Checkpoint location mặc định cho Structured Streaming
spark.sql.streaming.checkpointLocation  hdfs:///fleet-datalake/checkpoints/streaming

# =============================================================
# Parquet
# =============================================================
# Dùng Parquet V2 cho columnar pushdown tốt hơn
spark.sql.parquet.writeLegacyFormat false

# Merge schema khi đọc Parquet (hữu ích khi schema evolve theo thời gian)
spark.sql.parquet.mergeSchema      false

# =============================================================
# Logging
# =============================================================
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs:///fleet-datalake/spark-events
spark.history.fs.logDirectory      hdfs:///fleet-datalake/spark-events

# =============================================================
# UI
# =============================================================
spark.ui.port                      4040
