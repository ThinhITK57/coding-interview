# Kafka Connect Distributed Configuration for Fleet Platform
# Location: /opt/kafka/config/connect-distributed.properties

# =============================================================
# Kafka cluster connection
# =============================================================
bootstrap.servers=master:9092,slave1:9092,slave2:9092

# =============================================================
# Connect cluster identity
# =============================================================
# Tên nhóm Connect workers (nếu chạy multi-worker, cùng group.id sẽ chia sẻ tasks)
group.id=fleet-cdc-connect-cluster

# =============================================================
# Internal topics (Debezium lưu trạng thái connector vào đây)
# =============================================================
# Config topic: lưu config của từng connector đã đăng ký
config.storage.topic=fleet-cdc-connect-configs
config.storage.replication.factor=3

# Offset topic: lưu vị trí đọc WAL hiện tại (quan trọng nhất cho CDC)
offset.storage.topic=fleet-cdc-connect-offsets
offset.storage.replication.factor=3
offset.storage.partitions=25

# Status topic: lưu trạng thái running/failed/paused của connectors
status.storage.topic=fleet-cdc-connect-status
status.storage.replication.factor=3
status.storage.partitions=5

# =============================================================
# Converter — format message trên Kafka
# =============================================================
# Dùng JSON converter + schema cho CDC events
# Spark và Redis sync worker sẽ parse JSON này
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true

value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

# =============================================================
# REST API
# =============================================================
# Port để đăng ký/quản lý connectors qua REST
rest.port=8083
rest.advertised.host.name=master

# =============================================================
# Plugin path — nơi chứa Debezium connector JARs
# =============================================================
plugin.path=/opt/kafka/connect-plugins

# =============================================================
# Offset flush (tần suất commit offset đã đọc)
# =============================================================
# Commit mỗi 10 giây — nếu Connect restart, tối đa replay 10s data
offset.flush.interval.ms=10000
