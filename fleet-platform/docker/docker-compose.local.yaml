# =============================================================================
# Fleet Data Platform — Docker Compose Local Sandbox
# =============================================================================
# Khởi tạo toàn bộ hạ tầng phụ thuộc trên máy phát triển cá nhân:
#   - PostgreSQL 14 (giả lập Odoo OLTP + Hive Metastore)
#   - Redis 7 (Serving layer cache)
#   - Redpanda (Kafka-compatible, nhẹ hơn Kafka gốc cho local dev)
#   - MinIO (giả lập HDFS / S3 storage)
#
# Usage:
#   docker compose -f docker/docker-compose.local.yaml up -d
#   docker compose -f docker/docker-compose.local.yaml down -v

version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. PostgreSQL — Giả lập Odoo ERP OLTP + Hive Metastore DB
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: fleet-postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fleet_app
      POSTGRES_PASSWORD: local_dev_pass
      POSTGRES_DB: fleet_oltp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-oltp.sql:/docker-entrypoint-initdb.d/01-init-oltp.sql
      - ./init-scripts/init-metastore.sql:/docker-entrypoint-initdb.d/02-init-metastore.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_app -d fleet_oltp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Redis — Serving Layer Cache & Pub/Sub
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fleet-redis-local
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Redpanda — Kafka-Compatible Broker (Nhẹ, không cần Zookeeper)
  # ─────────────────────────────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: fleet-redpanda-local
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"   # Kafka protocol (external)
      - "18082:18082"   # HTTP Proxy
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Redpanda Console — Web UI xem Topics / Messages (tùy chọn)
  # ─────────────────────────────────────────────────────────────────────────
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: fleet-redpanda-console
    ports:
      - "8180:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      redpanda:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # 5. MinIO — Giả lập HDFS / S3 Object Storage
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fleet-minio-local
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 6. MinIO Init — Tạo sẵn Bucket fleet-datalake (Bronze/Silver/Gold)
  # ─────────────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: fleet-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing localminio/fleet-datalake &&
      mc mb --ignore-existing localminio/fleet-datalake-raw &&
      mc mb --ignore-existing localminio/fleet-datalake-silver &&
      mc mb --ignore-existing localminio/fleet-datalake-gold &&
      echo '✅ MinIO buckets initialized successfully.'
      "

volumes:
  postgres_data:
  minio_data:
